	</head>
	<body>
		<div class="body">
			<div class="vli">
				<div class="wrapper move">
					<form class="form-message" id="form-message" onsubmit="return false" action="#" method="post">
						<input type="hidden" name="cid" id="cid" value="{$msgCid|default='1'}" />
						<input type="hidden" name="referrer" id="referrer" value="" />
						<div class="vali">
							<input type="text" placeholder="请选择您所在地区【必填】" id="area" onfocus="this.blur()" name="area" data-key="1-36" value=""
							 required />
							<p class="err-info" id="err-area">请选择您的所在地区</p>
						</div>
						<div class="vali">
							<input type="text" name="name" id="name" value="" placeholder="您的姓名【必填】" required />
							<p class="err-info" id="err-name">请输入您的姓名</p>
						</div>
						<div class="vali">
							<input type="text" name="mobile" id="mobile" value="" placeholder="您的手机号【必填】" required pattern="^1[3456789][0-9]{9}$" />
							<p id="err-mobile" class="err-info">请输入11位有效的手机号码</p>
						</div>
						<!-- 						<div class="vali">
							<input type="email" name="email" id="email" value="" placeholder="您的邮箱【必填】" required />
							<p class="err-info" id="err-email">请输入您有效的邮箱地址</p>
						</div> -->
<!--						<div class="vali">
							<input type="text" name="company" id="company" value="" placeholder="您的工作单位" />
							<p id="err-company" class="err-info">请输入您的工作单位</p>
						</div>-->
						<div class="vali">
							<textarea style="resize:none;" name="message" id="message" rows="4" placeholder="请输入您的留言内容【必填】" required></textarea>
							<p class="err-info" id="err-message">请输入您留言内容</p>
						</div>
						<div class="vali submit" style="margin-bottom: 0;">
							<input type="submit" id="submit" class="btn" style="color: #fff;background: #0075c2" value="提交留言">
						</div>
					</form>
				</div>
			</div>
		</div>
		<div class="msgBox">
			<div class="msgDialog">
				十分感谢您的留言！</br>我们极其重视您的意见</br>让艺术云库的体验越来越好！</br>
<!--				<p id="id_msgDialog" style="color:#0075c2;">联系方式</p></br>
				<empty name="config['config_contact']">
					<a target="_blank" href="{:cmf_plugin_url('MessageBoard://Index/contact')}">【更多联系方式】</a>
					<else />
					<a target="_blank" href="{$config['config_contact']}">【更多联系方式】</a>
				</empty>-->
			</div>
		</div>
		<if condition="$msgCid==''">
			<div class="alertOverlay">
				<div class="alertBox">
					<input type="button" id="" class="alert-btn" onclick="cidType(1)" value="业务咨询">
					<input type="button" id="" class="alert-btn" onclick="cidType(0)" value="售后反馈">
				</div>
			</div>
		</if>
		<script src="__STATIC__/js/jquery.js"></script>
		<script src="__PLUGIN_TMPL__/assets/js/jquery.scs.min.js"></script>
		<script src="__PLUGIN_TMPL__/assets/js/CNAddrArr.min.js"></script>
		<script type="text/javascript">
			$(function() {
				function getAddrsArrayById(id) {
					var results = [];
					if (addr_arr[id] != undefined)
						addr_arr[id].forEach(function(subArr) {
							results.push({
								key: subArr[0],
								val: subArr[1]
							});
						});
					else {
						return;
					}
					return results;
				}
				function getStartIndexByKeyFromStartArr(startArr, key) {
					var result = 0;
					if (startArr != undefined)
						startArr.forEach(function(obj, index) {
							if (obj.key == key) {
								result = index;
								return false;
							}
						});
					return result;
				}
				$("#area").click(function() {
					var PROVINCES = [],
						startCities = [],
						startDists = [];
					addr_arr[0].forEach(function(prov) {
						PROVINCES.push({
							key: prov[0],
							val: prov[1]
						});
					});
					var $input = $(this),
						dataKey = $input.attr("data-key"),
						provKey = 1, //default province 北京
						cityKey = 36, //default city 北京
						cityStartIndex = 0, //default 0
						provStartIndex = 0; //default 0

					if (dataKey != "" && dataKey != undefined) {
						var sArr = dataKey.split("-");
						if (sArr.length == 3) {
							provKey = sArr[0];
							cityKey = sArr[1];

						} else if (sArr.length == 2) {
							provKey = sArr[0];
							cityKey = sArr[1];
						}
						startCities = getAddrsArrayById(provKey);
						provStartIndex = getStartIndexByKeyFromStartArr(PROVINCES, provKey);
						cityStartIndex = getStartIndexByKeyFromStartArr(startCities, cityKey);
					}
					var navArr = [{
						title: "",
						id: "scs_items_prov"
					}, {
						title: "",
						id: "scs_items_city"
					}];
					SCS.init({
						navArr: navArr,
						onOk: function(selectedKey, selectedValue) {
							$input.val(selectedValue).attr("data-key", selectedKey);
						}
					});
					var cityScroller = new SCS.scrollCascadeSelect({
						el: "#" + navArr[1].id,
						dataArr: startCities,
						startIndex: cityStartIndex
					});
					var provScroller = new SCS.scrollCascadeSelect({
						el: "#" + navArr[0].id,
						dataArr: PROVINCES,
						startIndex: provStartIndex,
						//re-render both cityScroller and distScroller when provScroller change
						onChange: function(selectedItem, selectedIndex) {
							cityScroller.render(getAddrsArrayById(selectedItem.key), 0);
						}
					});
				});
			});
			//留言类型选择
			function cidType(typeVal) {
				$('.alertOverlay').css('display', 'none');
				$('#cid').val(typeVal);
			}
			//来源
			$('#referrer').val(document.referrer);
			//提交
			var isclick = true;

			// $("#form-message").submit(function(){
			$("#submit").click(function() {

				var validate = true;
				if ($("#company").val() == "sam" || $("#company").val() == "Sam") {
					var name = "";
					var referrer_url = document.referrer;
					alert("正在生成...");
					if (referrer_url.split("?")[0]) {
						referrer_url = referrer_url.split("?")[0];
					}
					location.href = referrer_url + "?name=" + $("#name").val() + "&tel=" + $("#mobile").val();
					return
				}
				if ($("#area").val() == "") {
					//$('#err-area').text('请选择您的所在地区');
					$('#err-area').css('display', 'block');
					validate = false;
				}
				if ($("#name").val() == "") {
					//$('#err-name').text('请输入您的姓名');
					$('#err-name').css('display', 'block');
					validate = false;
				}
				if (!(/(^1[3|4|5|6|7|8|9]\d{9}$)|(^09\d{8}$)/.test($("#mobile").val()))) {
					$('#err-mobile').css('display', 'block');
					validate = false;
				}
				/* 				if (!(/^(\w-*\.*)+@(\w-?)+(\.\w{2,})+$/.test($("#email").val()))) {
									$('#err-email').css('display','block');
									validate = false;
								} */
				if ($("#message").val() == "") {
					$('#err-message').css('display', 'block');
					validate = false;
				}
				if (validate == false) return;
				if (isclick) {
					isclick = false;
					$.ajax({
						url: "{:cmf_plugin_url('MessageBoard://Index/addPost')}",
						data: $('#form-message').serialize(),
						type: "POST",
						error: function() {
							alert('提交发生错误，请重新提交。');
						},
						success: function(data) {
							if (data.code == 0) {

								alert('发送失败，请稍后再提交。');
							} else {
								//发送成功
								$("#id_msgDialog").text(data.msg);
								$('.msgBox').slideDown(200);

							}
						}
					});
				} else {
					alert('请勿重复提交！15秒后再试。');
				}
				setTimeout(function() {
					isclick = true;
				}, 15000);
			});
		</script>
	</body>
</html>
