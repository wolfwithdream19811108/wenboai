<!doctype html>
<html>
	<head>
		<include file="public/head" />
		<title>留言板后台管理</title>
		<meta name="description" content="">
		<meta name="keywords" content="">
	</head>
	<body>
		<div class="wrap js-check-wrap">
			<ul class="nav nav-tabs">
				<li><a href="{:cmf_plugin_url('MessageBoard://AdminIndex/index')}">全部留言</a></li>
				<li class="active"><a>售后反馈</a></li>
				<li><a href="{:cmf_plugin_url('MessageBoard://AdminIndex/contact')}">通讯录设置</a></li>
			</ul>
			<div class="common-form">
				<div class="table_list">
					<div class="table2excel" data-tableName="Test Table 1">
						<table width="100%" class="table table-hover">
							<thead>
								<tr>
									<th width="60">序号</th>
									<th width="160">所在地区</th>
									<th width="80">姓名</th>
									<th width="100">手机号</th>
									<th width="160">单位</th>
									<th>留言内容</th>
									<th width="120">时间</th>
									<th width="100">类型</th>
									<th width="100">状态</th>
									<th width="130">操作</th>
								</tr>
							</thead>
							<tbody>

								<foreach name="datalist" item="vo" key="k">
									<tr>
										<td>{$k+1}</td>
										<td>{$vo.area}</td>
										<td>{$vo.name}</td>
										<td>{$vo.mobile}</td>
										<td>{$vo.company}</td>
										<td>{$vo.message}</td>
										<td>{:date('Y-m-d H:i',$vo['create_time'])}</td>
										<td><a class="btn btn-warning btn-sm">售后反馈</a></td>
										<td>
											<eq name="$vo.isread" value="1">
												已查看
												<else />
												未查看
											</eq>
										</td>
										<td>
											<a href="javascript:parent.openIframeLayer('{:cmf_plugin_url('MessageBoard://AdminIndex/detail',['id'=>$vo['id']])}','{$vo.name}的留言详细信息',{area:['60%','70%']});"
											 class="btn btn-primary btn-sm">查看</a>
											<a href="{:cmf_plugin_url('MessageBoard://AdminIndex/delete',['id'=>$vo['id']])}" class="js-ajax-delete btn btn-danger btn-sm">删除</a>
										</td>
									</tr>
								</foreach>
							</tbody>
						</table>
						<button id="btn" class="btn btn-info btn-sm">导出到excel</button>
					</div>
					<div class="pagination">{$page}</div>
				</div>
			</div>
		</div>
		<include file="public/scripts" />
		<!-- excel 导出 -->
		<script src="__PLUGIN_TMPL__/assets/js/jquery.table2excel.js"></script>
		<script type="text/javascript">
			$(function() {
				$("#btn").click(function() {
					$(".table2excel").table2excel({
						exclude: ".noExl",
						name: "Excel Document Name",
						filename: "售后反馈",
						exclude_img: true,
						exclude_links: true,
						exclude_inputs: true
					});
				});

			});
		</script>
	</body>
</html>
