<!doctype html>
<html>
<head>
    <include file='public/head' />
    <title>付费阅读插件</title>
    <meta name="description" content="付费阅读插件">
    <meta name="keywords" content="付费阅读插件">
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a>付费列表</a></li>        
    </ul>    
    <div class="common-form">
        <form method="post" class="js-ajax-form" action="#">
            <div class="table_list">
                <table width="100%" class="table table-hover">
                    <thead>
                    <tr>
                        <th width="60">用户ID</th>
                        <th>昵称</th>
                        <th width="250">文章标题</th>                     
                        <th>支付金额</th>
                        <th>现价</th>
                        <th>账户余额</th>
                        <th>购买时间</th>
                    </tr>
                    </thead>
                    <tbody>
                    <foreach name="data" item="vo">
                        <tr>
                            <td>{$vo.id}</td>
                            <td>{$vo.user_nickname}</td>
                            <td><a target="_blank" href="{:url('portal/Article/index',array('id'=>$vo['postid'],'cid'=>$vo['cid']))}">{$vo.post_title}</a></td>
                            <td>{$vo.payed_money} 元</td>
                            <td>{$vo.__pay_money} 元</td>
                            <td>{$vo.balance} 元</td>
                            <td>{$vo.payed_time}</td>
                        </tr>
                    </foreach>
                    </tbody>
                </table>
                <ul class="pager">{$page}</ul>
            </div>
        </form>
    </div>
</div>
<script>
    function accountRepair(tid){
        $.post("{:cmf_url('/plugin/pay_personal/admin_index/accountRepair')}",{tid:tid},function(res){
            if(res.code == 0) window.location.reload()
        })
    }
</script>
<include file='public/scripts' />
</body>
</html>
