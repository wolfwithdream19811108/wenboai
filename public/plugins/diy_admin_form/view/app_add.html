<!doctype html>
<html>
<head>
    <include file="public/head"/>
    <title></title>
    <style>
        .form-required{
            color: #ff2222;
        }

    </style>
</head>
<body>
<div class="wrap js-check-wrap margin-top-10">
    <ul class="nav nav-tabs">
        <li><a href="{:cmf_plugin_url('DiyAdminForm://AdminApp/Index')}">配置应用</a></li>
        <li class="active"><a href="javascript:;">添加应用</a></li>
    </ul>
    <form action="{:cmf_plugin_url('DiyAdminForm://AdminApp/addPost')}"
          method="post" class="well form-inline js-ajax-form"
          style="padding-bottom: 0;margin-top: 5px">
        <table class="table table-bordered">
            <tr>
                <th width="100">
                    应用名称:
                </th>
                <td>
                    <input type="text" class="form-control" name="app_name"
                           required placeholder="应用名称,例如 myapp" style="width: 100%;">
                </td>
            </tr>
            <tr>
                <th>菜单名称:</th>
                <td>
                    <input type="text" class="form-control" name="menu_name"
                           placeholder="顶级菜单名称" style="width: 100%" required>
                </td>
            </tr>

            <tr>
                <th>菜单排序:</th>
                <td>
                    <input type="text" class="form-control" name="menu_order"
                           value="50" style="width: 100%">
                </td>
            </tr>
            <tr>
                <th>菜单图标:</th>
                <td>
                    <input type="text" class="form-control" name="menu_icon"
                           value="book" style="width: 100%">
                    不带前缀fa-，如fa-user => user
                </td>
            </tr>
        </table>

        <div class="text-center">
            <button type="submit" class="btn btn-primary js-ajax-submit">添加</button>
        </div>
    </form>
</div>
<include file="public/scripts"/>

</body>
</html>
