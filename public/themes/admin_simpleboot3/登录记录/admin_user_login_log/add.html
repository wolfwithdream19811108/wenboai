<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li><a href="{:url('AdminUserLoginLog/index')}">所有用户登录记录</a></li>
        <li class="active"><a href="#">添加用户登录记录</a></li>
    </ul>
    <form action="{:url('AdminUserLoginLog/addPost')}"
          method="post" class="form-horizontal js-ajax-form margin-top-20">
        <div class="row">
            <div class="col-md-8">
                <table class="table table-bordered">
                    <tr>
						<th width="150">ID<span class="form-required">*</span></th>
						<td>
							<input class="form-control" type="text" name="id"
                                   required value="" 
                                   placeholder="请输入ID"/>
						</td>
					</tr>
					<tr>
						<th>USERNAME<span class="form-required">*</span></th>
						<td>
							<input class="form-control" type="text" name="username"
                                   required value=""  maxlength="50"
                                   placeholder="请输入USERNAME"/>
						</td>
					</tr>
					<tr>
						<th>PWD<span class="form-required">*</span></th>
						<td>
							<input class="form-control" type="text" name="pwd"
                                   required value=""  maxlength="50"
                                   placeholder="请输入PWD"/>
						</td>
					</tr>
					<tr>
						<th>SUCCEED<span class="form-required">*</span></th>
						<td>
							<input class="form-control" type="text" name="succeed"
                                   required value="" 
                                   placeholder="请输入SUCCEED"/>
						</td>
					</tr>
					<tr>
						<th>TIME<span class="form-required">*</span></th>
						<td>
							<input class="form-control" type="text" name="time"
                                   required value="" 
                                   placeholder="请输入TIME"/>
						</td>
					</tr>
					<tr>
						<th>IP<span class="form-required">*</span></th>
						<td>
							<input class="form-control" type="text" name="ip"
                                   required value=""  maxlength="15"
                                   placeholder="请输入IP"/>
						</td>
					</tr>
					<tr>
						<th>DATETIME<span class="form-required">*</span></th>
						<td>
							<input class="form-control" type="text" name="datetime"
                                   required value=""  maxlength="50"
                                   placeholder="请输入DATETIME"/>
						</td>
					</tr>

                </table>
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <button type="submit" class="btn btn-primary js-ajax-submit">{:lang('SAVE')}</button>
                <a class="btn btn-default" href="javascript:history.back(-1);">{:lang('BACK')}</a>
            </div>
        </div>
    </form>
</div>
<script type="text/javascript" src="__STATIC__/js/admin.js"></script>
</body>
</html>
