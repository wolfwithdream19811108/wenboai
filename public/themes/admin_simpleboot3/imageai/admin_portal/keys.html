<include file="public@header"/></head><body><div class="wrap"><include file="imageai/admin_portal@_tabs"/><table class="table table-bordered table-hover margin-top-20"><thead><tr><th>ID</th><th>用户</th><th>名称</th><th>标识</th><th>状态</th><th>最后使用</th><th></th></tr></thead><tbody><foreach name="list" item="v"><tr><td>{$v.id}</td><td>{$v.user_id}<br><if condition="!empty($v.mobile)">{$v.mobile}<else/>{$v.user_login}</if></td><td>{$v.name}</td><td><code>{$v.key_prefix}…{$v.key_suffix}</code></td><td><if condition="$v.status eq 1">有效<else/>已撤销</if></td><td><if condition="$v.last_used_at">{:date('Y-m-d H:i:s',$v.last_used_at)}<br>{$v.last_used_ip}<else/>从未使用</if></td><td><if condition="$v.status eq 1"><a class="btn btn-xs btn-danger js-ajax-dialog-btn" data-msg="确认撤销？" href="{:url('AdminPortal/revokeKey',['id'=>$v.id])}">撤销</a></if></td></tr></foreach></tbody></table><div class="pagination">{$page}</div></div><script src="__STATIC__/js/admin.js"></script></body></html>
