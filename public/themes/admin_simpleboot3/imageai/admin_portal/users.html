<include file="public@header"/></head><body><div class="wrap"><include file="imageai/admin_portal@_tabs"/><form class="well form-inline margin-top-20"><input class="form-control" name="keyword" value="{:input('request.keyword')}" placeholder="手机号或昵称"><button class="btn btn-primary">搜索</button></form><table class="table table-bordered table-hover"><thead><tr><th>用户ID</th><th>手机</th><th>账号类型</th><th>协议版本</th><th>同意时间/IP</th><th>状态</th><th></th></tr></thead><tbody><foreach name="list" item="v"><tr><td>{$v.user_id}</td><td>{$v.mobile}</td><td>{$v.account_mode}</td><td>{$v.service_agreement_version}<br>{$v.privacy_agreement_version}</td><td>{:date('Y-m-d H:i:s',$v.agreement_accepted_at)}<br>{$v.agreement_ip}</td><td><if condition="$v.status eq 1"><span class="label label-success">启用</span><else/><span class="label label-danger">停用</span></if></td><td><if condition="$v.status eq 1"><a class="btn btn-xs btn-warning js-ajax-dialog-btn" data-msg="确认停用？" href="{:url('AdminPortal/userStatus',['id'=>$v.user_id,'status'=>0])}">停用</a><else/><a class="btn btn-xs btn-success js-ajax-dialog-btn" href="{:url('AdminPortal/userStatus',['id'=>$v.user_id,'status'=>1])}">启用</a></if></td></tr></foreach></tbody></table><div class="pagination">{$page}</div></div><script src="__STATIC__/js/admin.js"></script></body></html>
