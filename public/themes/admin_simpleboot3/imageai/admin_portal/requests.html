<include file="public@header"/></head><body><div class="wrap"><include file="imageai/admin_portal@_tabs"/><form class="well form-inline margin-top-20"><select name="status" class="form-control"><option value="">全部结果</option><option value="success">success</option><option value="reject">reject</option><option value="error">error</option></select><button class="btn btn-primary">筛选</button></form><table class="table table-bordered table-hover"><thead><tr><th>请求ID</th><th>用户</th><th>模型</th><th>结果</th><th>原因</th><th>积分/耗时</th><th>时间</th></tr></thead><tbody><foreach name="list" item="v"><tr><td><code>{$v.request_id}</code></td><td>{$v.user_id}<br><if condition="!empty($v.mobile)">{$v.mobile}<else/>{$v.user_login}</if></td><td>{$v.model}</td><td>{$v.status}</td><td>{$v.reason}</td><td>{$v.points} / {$v.duration_ms}ms</td><td>{:date('Y-m-d H:i:s',$v.create_time)}</td></tr></foreach></tbody></table><div class="pagination">{$page}</div></div></body></html>
