<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li><a href="{:url('AdminPortalIndustry/index')}">所有产业数据表</a></li>
        <li><a href="{:url('AdminPortalIndustry/add')}">添加产业数据表</a></li>
        <li class="active"><a href="#">编辑产业数据表</a></li>
    </ul>
    <form action="{:url('AdminPortalIndustry/editPost',array('id'=>$post['id']))}"
          method="post" class="form-horizontal js-ajax-form margin-top-20">
        <div class="row">
            <div class="col-md-8">
                <table class="table table-bordered">
                    <tr>
						<th width="150">公司名<span class="form-required">*</span></th>
						<td>
							<input class="form-control" type="text" name="company"
                                   required value="{$post.company|default=''}"  maxlength="255"
                                   placeholder="请输入公司名"/>
						</td>
					</tr>
					<tr>
						<th>年份<span class="form-required">*</span></th>
						<td>
							<input class="form-control" type="text" name="year"
                                   required value="{$post.year|default=''}" 
                                   placeholder="请输入年份"/>
						</td>
					</tr>
					<tr>
						<th>收入<span class="form-required">*</span></th>
						<td>
							<input class="form-control" type="text" name="income"
                                   required value="{$post.income|default=''}" 
                                   placeholder="请输入收入"/>
						</td>
					</tr>
					<tr>
						<th>成本<span class="form-required">*</span></th>
						<td>
							<input class="form-control" type="text" name="cost"
                                   required value="{$post.cost|default=''}" 
                                   placeholder="请输入成本"/>
						</td>
					</tr>
					<tr>
						<th>利润<span class="form-required">*</span></th>
						<td>
							<input class="form-control" type="text" name="net"
                                   required value="{$post.net|default=''}" 
                                   placeholder="请输入利润"/>
						</td>
					</tr>
					<tr>
						<th>税收<span class="form-required">*</span></th>
						<td>
							<input class="form-control" type="text" name="tax"
                                   required value="{$post.tax|default=''}" 
                                   placeholder="请输入税收"/>
						</td>
					</tr>
					<tr>
						<th>负债<span class="form-required">*</span></th>
						<td>
							<input class="form-control" type="text" name="debt"
                                   required value="{$post.debt|default=''}" 
                                   placeholder="请输入负债"/>
						</td>
					</tr>
					<tr>
						<th>城市<span class="form-required">*</span></th>
						<td>
							<input class="form-control" type="text" name="city"
                                   required value="{$post.city|default=''}"  maxlength="255"
                                   placeholder="请输入城市"/>
						</td>
					</tr>

                </table>
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <button type="submit" class="btn btn-primary js-ajax-submit">{:lang('SAVE')}</button>
                <a class="btn btn-default" href="javascript:history.back(-1);">{:lang('BACK')}</a>
            </div>
        </div>
    </form>
</div>
<script type="text/javascript" src="__STATIC__/js/admin.js"></script>
</body>
</html>
