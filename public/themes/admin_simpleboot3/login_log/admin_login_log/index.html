<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="javascript:;">用户登录记录</a></li>
    </ul>
    <form class="well form-inline" method="post" action="{:url('AdminLoginLog/index')}">
        {//列表页顶部查询字段}
        		&nbsp;用户名:

        <input type="text" class="form-control" name="username" value="{$username|default=''}" placeholder="请输入用户名">
        <input type="submit" class="btn btn-primary" value="搜索"/>
    </form>
    <form class="js-ajax-form" action="" method="post">
        <div class="table-actions">

        </div>

        <table class="table table-hover table-bordered table-list">
            <thead>
            <tr>
				<th width="100">用户名</th>
				<th width="100">登录时间戳</th>
				<th width="100">登录时间</th>

            </tr>
            </thead>
            <notempty name="list">
                <foreach name="list" item="vo">
                    <tr>
						<td>{$vo.username}</td>
						<td>{$vo.time}</td>
						<td>{$vo.datetime}</td>
                    </tr>
                </foreach>
            </notempty>
        </table>

        <div class="text-center">
            <ul class="pagination" style="margin-bottom: 0;margin-top: 10px">{$page|default=''}</ul>
        </div>
    </form>
</div>
<script src="__STATIC__/js/admin.js"></script>
<script>
    function reloadPage(win) {
        win.location.reload();
    };
    $(function () {
        setCookie("refersh_time", 0);
    });
</script>
</body>
</html>
