<block name="scripts">
<script type="text/javascript">

$(document).ready(function() {
	category = '<?php echo $category; ?>'
    pageIsOver = '<?php echo $pageIsOver; ?>'
    total_pages = '<?php echo $total_pages; ?>'
	if (category == 0)
	{
		var filter=document.getElementById("filter");
		var child=document.getElementById("museumlist");
		filter.removeChild(child);
	}

  	if(pageIsOver)
	{
		var curPath = window.document.location.href;
        curPath = curPath+'&'
		var regex = /page=(.+?)&/;
		var pageNum = curPath.match(regex);
		var jumpUrl = curPath.replace(regex,"page=1&").replace("&&","&");
		window.location.href=jumpUrl;
	}
  
    if(total_pages==0)
	{

	    	layer.msg('无更多作品，请重新筛选作品', {
            	  icon: 1,
            	  time: 5000 //2秒关闭（如果不配置，默认是3秒）
            	}, function(){
                    var curPath = window.document.location.href;
                    var jumpUrl = curPath.substr(0,curPath.indexOf("&")+1);
                    window.location.href=jumpUrl;
                });
	}
 
  });

 function openImage(imgUrl) {
    // 向A网页发送消息
    window.parent.postMessage({
        action: 'imageClicked',
        imageUrl: imgUrl
    }, 'https://www.hongmengyishu.com'); // 指定确切的来源以提高安全性       
        
        
}

$("#search").keydown(function(e){
	if(e.keyCode == 13){
	    
		var keyword = document.getElementById('search').value
		if(keyword){
    		var url = '/ai/index/ref_img_search_list?keyword='+keyword
    		$(location).attr('href', url);
		}else{
            layer.msg('关键词不能为空', {
                icon: 1,
                time: 2000 //2秒关闭（如果不配置，默认是3秒）
                }, function(){
            });
		}
	}
	});
	
    $('#searchbtn').click(function (e) {

		var keyword = document.getElementById('search').value
		if(keyword){
    		var url = '/ai/index/ref_img_search_list?keyword='+keyword
    		$(location).attr('href', url);
		}else{
            layer.msg('关键词不能为空', {
                icon: 1,
                time: 2000 //2秒关闭（如果不配置，默认是3秒）
                }, function(){
            });
		}
    });

       

</script>
