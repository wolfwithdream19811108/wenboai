<!DOCTYPE html>
<include file="public@head"/>
<include file="public@scripts"/>
<style>
 
.search-section {
  margin-top: 2px;
  margin-left: 60px;
  width: 300px;
  border-radius: 3px;
  height: 35px;
}
</style>
<block name="body">
<div class="container">

	<!--<div class="col-lg-9">-->
	<div class="col-lg-12">
		<div class="row">
		    
      

		    
		    
		    
			<div id="filter" class="cation-middle">
				<dl class="cation-list">
					<dt>分类</dt>
					<dd>

        				<foreach name="category_list" item="vo">
                            <a href="" rel="{$vo['name']}" name="category" class="default" data-categoryid="{$vo['name']}">{$vo['name']}</a>
        				</foreach>						
						
						
					</dd>
				</dl>

			</div>
		

			<div class="" id="my-gallery-container">
				<foreach name="articles" item="vo">
					<div class="item" onclick="openImage('{$vo.image}')">

    						<notempty name="$vo.image">
    							<div  align="left" class="blog-img img">
    							    <figure class="effect-ruby">
        								<img class="img002" src="{$vo.image}!thumb" />
    								</figure>
    							</div>
    						</notempty>


					</div>
				</foreach>
			</div>
		</div>
		<!--分页-->
<!--		<div class="text-center">
			<ul class="pagination">{$page|default=''}</ul>
		</div>-->
	</div>

</div>

</block>

<block name="scripts">
<script type="text/javascript">

 function openImage(imgUrl) {
    // 向A网页发送消息
    window.parent.postMessage({
        action: 'imageClicked',
        imageUrl: imgUrl
    }, 'https://www.hongmengyishu.com'); // 指定确切的来源以提高安全性       
   
        
}
</script>

</block>
