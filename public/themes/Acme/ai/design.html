<script >
    
//计算等比例缩放的图片尺寸



function calculateScaleFactor(canvasWidth, canvasHeight, imageWidth, imageHeight, occupyRatio) {
    // 确定图片和画布的最长边
    const imageLongestSide = Math.max(imageWidth, imageHeight);
    const canvasLongestSide = Math.max(canvasWidth, canvasHeight);

    // 根据指定比例计算图片最长边在画布上应占据的长度
    const targetLength = canvasLongestSide * occupyRatio;

    // 计算缩放因子，使图片最长边等于目标长度
    const scaleFactor = targetLength / imageLongestSide;

    // 返回缩放因子
    return scaleFactor;
}




//生成唯一值
function generateUniqueId() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2, 9) + '';
}

let addToCanvasOffset = 0; // 放置图片到画布上的偏移量初始化为 0
let activeElementImageType = "宝相花"//元素图片弹窗内选择的类型
const iw = 100 //元素图片宽度
const ih = 100//元素图片高度
const r_iconOffsetY = 24//旋转图标y偏移
const r_iconSize = 30//旋转图标大小
const canvasWidth = 800;//canvas像素宽
const canvasHeight = 800;//canvas像素高
let ppage = 1;  // 作品初始页码
const ppageSize = 20;  // 每页加载的数量
const uid = 7;  // 用户 ID
let ploading = false; // 防止重复加载
let epage = 1;  // 作品初始页码
const epageSize = 20;  // 每页加载的数量
let eloading = false; // 防止重复加载
const productActionBar = document.getElementById('productActionBar') //商品操作栏组件
const elementActionBar = document.getElementById('elementActionBar')//元素操作栏组件
const layerList = document.getElementById('layer-list');//图层组件
let selectedImage = null //当前选中的图层
const sizePopup = document.getElementById('sizePopup') //大小设置组件
const productListPopUp = document.getElementById('productListPopUp') //商品图片弹窗组件
const elementListPopUp = document.getElementById('elementListPopUp') //元素图片弹窗组件
const pmore = document.getElementById('pmore')//商品加载更多组件
const emore = document.getElementById('emore')//元素加载更多组件

fabric.Object.prototype.originX = fabric.Object.prototype.originY = 'center';//设置为中心

// 用于获取对象的绝对坐标
fabric.Canvas.prototype.getObjectComputedValue = function (object) {
    return {
        abLeft: object.left + this._offset.left,
        abTop: object.top + this._offset.top,
        scaledHeight: object.height * object.scaleY,
        scaledWidth: object.width * object.scaleX
    };
};
//自定义旋转图标

function createRotateIcon() {


    fabric.Object.prototype.controls.mtr.visible = false; // 隐藏默认的旋转控件
    const r_icon = '__TMPL__/public/assets/img/r_icon.png'
    var img = document.createElement('img');
    img.src = r_icon;
    fabric.Object.prototype.controls.customRotateControl = new fabric.Control({
        // x: 0,               // Center horizontally
        // y: 0,             // Position at the bottom
        // offsetY: ih / 2 + r_iconOffsetY,
        cursorStyle: 'pointer',
        actionHandler: fabric.controlsUtils.rotationWithSnapping,
        render: renderIcon,
        cornerSize: r_iconSize
    });
    function renderIcon(ctx, left, top, styleOverride, fabricObject) {



        var size = this.cornerSize;
        ctx.save();
        // ctx.translate(left, fabricObject.top + fabricObject.height * fabricObject.scaleY / 2 + r_iconOffsetY);
        // 计算新的旋转图标元素（旋转控制点的覆盖物）位置
        ctx.translate(left,top);



        // ctx.rotate(fabric.util.degreesToRadians(fabricObject.angle));
        ctx.drawImage(img, -size / 2, -size / 2, size, size);
        ctx.restore();



    }
}
createRotateIcon()
// 初始化 Fabric.js 画布并启用对象堆叠顺序
const canvas = new fabric.Canvas('canvas', {
    preserveObjectStacking: true  // 保留对象堆叠顺序
});
canvas.on('selection:cleared', function (event) {
    // 取消选中的对象的回调逻辑
    elementActionBar.style.display = 'none'; // 隐藏 elementActionBar
    productActionBar.style.display = 'none';  // 隐藏 productActionBar

    document.querySelectorAll('.layer-item').forEach(option => {

        option.classList.remove('active');
    });

    document.querySelectorAll('.layer-options').forEach(option => {

        option.classList.remove('show');
    });
    selectedImage = null
});


// 显示或隐藏大小调整弹出框
function togglePopup(show) {

    sizePopup.style.display = show ? 'block' : 'none';
    //回显上次选中的值
    if (show) {
        document.querySelectorAll('.layersize-radio').forEach(option => {
            if (selectedImage.sizeId === option.dataset.sizeid) {
                option.classList.add('active');
            }
        });
    }

}
//层级组件
// 将新图层项添加到面板的函数
function addLayerToPanel(object) {
    const li = document.createElement('li');
    li.classList.add('layer-item');
    li.draggable = true;
    li.dataset.id = object.id;
    li.addEventListener('click', function (e) {

        document.querySelectorAll('.layer-item').forEach(option => {

            option.classList.remove('active');
        });

        if (object !== selectedImage) {
            //如果点击的对象没有变化则不删除show
            document.querySelectorAll('.layer-options').forEach(option => {

                option.classList.remove('show');
            });
            togglePopup(false)

        }

        li.classList.add('active');

        canvas.setActiveObject(object)
        canvas.renderAll()
    }, true)
    // 创建图层预览和选项菜单
    li.innerHTML = `
   <img class='pic' data-id="${object.id}" src="${object.toDataURL()}" alt="图层预览" />

<div class="layer-options" data-id="${object.id}">
    <div data-id="${object.id}" onclick="duplicateLayer('${object.id}')" class='lo-item'><img class="li-icon" src="__TMPL__/public/assets/img/copy_icon.png" alt="">创建副本</div>
    <div data-id="${object.id}" onclick="deleteLayer('${object.id}')" class='lo-item'><img class="li-icon" src="__TMPL__/public/assets/img/delete_icon.png" alt="">删除</div>
</div>
<span data-id="${object.id}" class="layer-menu" onclick="showLayerOptions(event,this)">⋮</span>
`;

    layerList.insertBefore(li, layerList.firstChild);

    // 添加用于重新排序的拖动事件
    li.addEventListener('dragstart', dragStart);
    li.addEventListener('dragover', dragOver);
    li.addEventListener('drop', drop);
}
//点击三个点
function showLayerOptions(event, menuButton) {

    document.querySelectorAll('.layer-options').forEach(option => {

        option.classList.remove('show');
    });

    const options = menuButton.previousElementSibling;
    if (options && options.classList.contains('layer-options')) {
        options.classList.add('show');
    }

}
// 添加拖动事件
function dragStart(e) {
    e.dataTransfer.setData('text/plain', e.target.dataset.id);
}

function dragOver(e) {
    e.preventDefault(); // 允许放置
}

function drop(e) {
    e.preventDefault();
    const draggedId = e.dataTransfer.getData('text/plain');
    const targetId = e.target.closest('.layer-item').dataset.id;

    console.log(targetId, 'targetId', draggedId)
    // 通过 ID 在 Fabric 画布中查找对象
    const draggedObject = canvas.getObjects().find(obj => obj.id === draggedId);
    const targetObject = canvas.getObjects().find(obj => obj.id === targetId);

    // 在画布中重新排序对象
    const draggedIndex = canvas.getObjects().indexOf(draggedObject);
    const targetIndex = canvas.getObjects().indexOf(targetObject);
    /* 堆叠顺序调整 */
    canvas.moveTo(draggedObject, targetIndex);
    canvas.moveTo(targetObject, draggedIndex);
    canvas.setActiveObject(draggedObject)
    // 更新面板以反映新的顺序
    updateLayerPanel();
    canvas.renderAll()

}

// 更新图层面板的函数（清空并重新添加所有图层）
function updateLayerPanel() {
    layerList.innerHTML = '';
    canvas.getObjects().forEach(addLayerToPanel);
    document.querySelectorAll('.layer-item').forEach(option => {
        if (selectedImage && option.getAttribute('data-id') === selectedImage.id) {
            option.classList.add('active');

        } else {
            option.classList.remove('active');
        }
    });

}

// 复制图层的函数
function duplicateLayer(id) {
    cloneSelected()

    updateLayerPanel();
}

// 删除图层的函数
function deleteLayer(id) {

    const object = canvas.getObjects().find(obj => obj.id === id);

    deleteSelected()

}
//层级组件
// 获取自定义大小输入的值
function getCustomSize() {
    const customSizeInput = document.getElementById('customSize');
    return parseFloat(customSizeInput.value) / 100; // 转换为百分比
}
// 调整选中图层的大小
function resizeLayer(size, self) {
    //更新自定义输入框父元素的data属性
    let dataSet = self.dataset
    let currentTarget= self
    if (self.id === 'customSize') {
        currentTarget= document.getElementById( 'customSizeP')
        currentTarget.dataset.size = size
        dataSet = currentTarget.dataset
    } else if (self.id === 'customSizeP') {
        self.dataset.size = size

    }
    document.querySelectorAll('.layersize-radio').forEach(option => {
            option.classList.remove('active');
    });
    currentTarget.classList.add('active');
    const activeObject = canvas.getActiveObject();
    if (activeObject && size) {
        if (size === 'default') {
            // 恢复为初始宽高
            const { initialWidth, initialHeight } = activeObject.data;

            activeObject.scaleToWidth(initialWidth);

            // activeObject.scaleToHeight(initialHeight);
        } else {

            const { height, width } = activeObject;
            // 按比例调整宽高
            const scaledDimensions = calculateScaleFactor(canvasWidth, canvasHeight, width, height, size);

            // const containerWidth = canvas.width;
            // const containerHeight = canvas.height;
            // const newWidth = containerWidth * size;
            // const newHeight = containerHeight * size;
            const newWidth = scaledDimensions * activeObject.width;
            activeObject.scaleToWidth(newWidth);
            // activeObject.scaleToHeight(newHeight);
        }
        activeObject.setCoords(); // 更新对象坐标
        positionBtn(activeObject);
        activeObject.controls.customRotateControl.offsetY = canvas.getObjectComputedValue(activeObject).scaledHeight / 2 + r_iconOffsetY

        canvas.renderAll(); // 渲染画布

    }
    activeObject.set({
        size,
        sizeId: dataSet.sizeid
    })
}

//作品和元素图片加载逻辑
// 获取作品列表的函数

const observerP = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            loadWorks();

//转换src为本地资源
function loadImageAsBase64(url, callback) {
    return fetch(url)
        .then(response => response.blob()) // 将响应转换为 Blob
        .then(blob => {
            const reader = new FileReader();
            reader.onloadend = function () {
                callback(reader.result); // 返回Base64字符串
            };
            reader.readAsDataURL(blob); // 将 Blob 读取为 Data URL (Base64)
        })
        .catch(error => console.error('Error fetching image:', error));
}

//图片绑定事件
function bindEvents(object) {
    // 为图片对象添加事件监听器，当对象移动时调用 `positionBtn` 函数
    object.on('moving', function () {
        elementActionBar.style.display = 'none'; // 隐藏 elementActionBar
        productActionBar.style.display = 'none';  // 隐藏 productActionBar
        object.controls.customRotateControl.visible = false;//隐藏旋转按钮
        togglePopup(false)

    });
    // 监听变化之后事件

    object.on('modified', function () {
        console.log(11)
        //更新旋转图标位置
        if (object.controls.customRotateControl) {
            object.controls.customRotateControl.offsetY = canvas.getObjectComputedValue(object).scaledHeight / 2 + r_iconOffsetY
        }

        positionBtn(object);
        object.controls.customRotateControl.visible = true;
    });
    // 监听旋转事件
    object.on('rotating', function () {

        elementActionBar.style.display = 'none'; // 隐藏 elementActionBar
        productActionBar.style.display = 'none';  // 隐藏 productActionBar

    });
    // 当对象缩放时调用 `positionBtn` 函数
    object.on('scaling', function () {
        object.controls.customRotateControl.visible = false;

        elementActionBar.style.display = 'none'; // 隐藏 elementActionBar
        productActionBar.style.display = 'none';  // 隐藏 productActionBar

    });
    object.on('selected', function () {
        togglePopup(false)

        selectedImage = object
        document.querySelectorAll('.layer-options').forEach(option => {
            option.classList.remove('show');
        });
        document.querySelectorAll('.layer-item').forEach(option => {
            if (option.getAttribute('data-id') === object.id) {
                option.classList.add('active');

            } else {

                option.classList.remove('active');
            }
        });
        object.controls.customRotateControl.offsetY = canvas.getObjectComputedValue(object).scaledHeight / 2 + r_iconOffsetY
        positionBtn(object);
    })
}



// 添加图片到画布的函数
function addImageToCanvas(src, type) {
    fabric.Image.fromURL(src, (img) => {

        const center = canvas.getCenter();

        const scaleRatio = type === 'product' ? 0.7 : 0.2;
        const scaledDimensions = calculateScaleFactor(canvasWidth, canvasHeight, img.width, img.height, scaleRatio);


        img.set({
            angle: 0,

            scaleX: scaledDimensions, //iw / img.width,
            scaleY: scaledDimensions,//ih / img.height,
            data: {
                initialWidth: img.width * scaledDimensions, //iw,
                initialHeight: img.height * scaledDimensions//ih 
            },
            type: type,
            left: center.left + addToCanvasOffset,
            top: center.top + addToCanvasOffset,
            id: generateUniqueId(),
            size: 'default',
            sizeId: '0'
        });
        img.setControlsVisibility({
            mt: false, // 上边
            mb: false, // 下边
            ml: false, // 左边
            mr: false, // 右边
            tl: true,  // 左上角
            tr: true,  // 右上角
            bl: true,  // 左下角
            br: true   // 右下角
        });

        canvas.add(img);
        canvas.setActiveObject(img);

        bindEvents(img)
        // 初次设置按钮的位置
        positionBtn(img);
        addToCanvasOffset += 10;
    });
}

// 用于定位按钮到对象的上方
function positionBtn(obj) {
    // obj.left.top是图形圆心所在的位置
    // 获取对象的绝对坐标
    var objCValue = canvas.getObjectComputedValue(obj);
    const btnMargin = 10
    // 设置按钮的左边和顶部位置，使其在对象正上方偏移10像素
    if (obj.type === "product") {
        productActionBar.style.display = 'block'; // 显示 productActionBar
        elementActionBar.style.display = 'none';  // 隐藏 elementActionBar

        const btnWidth = productActionBar.getBoundingClientRect().width;
        const btnHeight = productActionBar.getBoundingClientRect().height;

        productActionBar.style.left = (obj.left - btnWidth / 2) + 'px';
        productActionBar.style.top = (obj.top - objCValue.scaledHeight / 2 - btnHeight - btnMargin) + 'px';
    } else if (obj.type === "element") {
        elementActionBar.style.display = 'block'; // 显示 elementActionBar
        productActionBar.style.display = 'none';  // 隐藏 productActionBar
        const btnWidth = elementActionBar.getBoundingClientRect().width;
        const btnHeight = elementActionBar.getBoundingClientRect().height;
        elementActionBar.style.left = (obj.left - btnWidth / 2) + 'px';
        elementActionBar.style.top = (obj.top - objCValue.scaledHeight / 2 - btnHeight - btnMargin) + 'px';

    }
}

// 复制选中的对象
function cloneSelected() {
    const activeObject = canvas.getActiveObject();
    if (activeObject) {

        activeObject.clone((clonedObj) => {
            clonedObj.set({
                scaleX: activeObject.scaleX, //iw / img.width,
                scaleY: activeObject.scaleY,//ih / img.height,
                left: activeObject.left + addToCanvasOffset,  // 偏移一点位置
                top: activeObject.top + addToCanvasOffset,
                data: activeObject.data,
                type: activeObject.type,
                id: generateUniqueId(),
                size: activeObject.size,
                sizeId: activeObject.sizeId
            });
            clonedObj.setControlsVisibility({
                mt: false, // 上边
                mb: false, // 下边
                ml: false, // 左边
                mr: false, // 右边
                tl: true,  // 左上角
                tr: true,  // 右上角
                bl: true,  // 左下角
                br: true   // 右下角
            });
            canvas.add(clonedObj);
            bindEvents(clonedObj)

            canvas.setActiveObject(clonedObj);

        });
    }
}

function exportAsImagetoServer() {
    const dataURL = canvas.toDataURL({
        format: 'png',  // 图片格式可以是 'png' 或 'jpeg'
        quality: 1.0,  // 图片质量（仅适用于 'jpeg' 格式）

// 创建一个Blob对象，用于构建发送到服务器的数据

    })

    .then(data => {
        console.log('Image uploaded successfully', data);
        // 处理服务器响应的数据
    })
    .catch((error) => {
        console.error('Error uploading image:', error);
    });
}
function dataURItoBlob(dataURI) {  
        
      // 获取Base64编码的数据
        const byteString = atob(dataURI.split(',')[1]);
        // 将Base64编码转换为8位无符号整数数组
        const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) {
            ia[i] = byteString.charCodeAt(i);
        }
        return new Blob([ab], {type: mimeString});       
        
    }
