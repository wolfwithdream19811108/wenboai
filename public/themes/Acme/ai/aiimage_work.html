<script>


  function zoomIn(thumbnail) {
    thumbnail.style.transform = "scale(1.1)";
  }

  function zoomOut(thumbnail) {
    thumbnail.style.transform = "scale(1)";
  }




function closestyle()
{
    var index = parent.layer.getFrameIndex(window.name)
    parent.layer.close(index)
    //parent.layer.closeAll()
  
}

var globalResizedImage = null

function resizeImage(blob) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = function() {
      const maxWidth = 1000;
      const maxHeight = 1000;
      let width = img.width;
      let height = img.height;

      if (width <= maxWidth && height <= maxHeight) {
        resolve(blob); // 图像尺寸不大于1000px，无需压缩处理
        return;
      }

      if (width > height) {
        if (width > maxWidth) {
          height *= maxWidth / width;
          width = maxWidth;
        }
      } else {
        if (height > maxHeight) {
          width *= maxHeight / height;
          height = maxHeight;
        }
      }

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);

      canvas.toBlob(resolve, 'image/jpeg', 0.9);
    };

    img.onerror = function() {
      reject(new Error('Failed to load image'));
    };

    img.src = URL.createObjectURL(blob);
  });
}

function reimagineSingle(index){
    
    var imageElemnet = document.getElementById("reimage"+index);
    reimagine(globalResizedImage,imageElemnet)
    
}
function reimagineAll(){
    var imageElemnet = document.getElementById("reimage1");
    reimagine(globalResizedImage,imageElemnet) 
    var imageElemnet = document.getElementById("reimage2");
    reimagine(globalResizedImage,imageElemnet) 
    var imageElemnet = document.getElementById("reimage3");
    reimagine(globalResizedImage,imageElemnet) 
}


function reimagine(resizeBlob,imgElement){
    var loadingElement = document.getElementById("loading");
    loadingElement.style.display='block'
    sendimagineRequest(resizeBlob,imgElement);
 
}

function sendimagineRequest(resizeBlob,imgElement) {
  const form = new FormData();
  form.append('image_file', resizeBlob, 'appartment.jpg');

  return fetch('https://clipdrop-api.co/reimagine/v1/reimagine', {
    method: 'POST',
    headers: {
      'x-api-key': 'ff7a98b864826af3c2a81ca8cf738d1de2f9d2c0a912fb468574ef93940a92ab2b3f5a848ba277a7991111059127324b',
    },
    body: form,
  })
    .then(response => {
      if (!response.ok) {
        console.log(response.text());
        throw new Error('Request failed with status ' + response.status);
      }
      return response.arrayBuffer();
    })
    .then(buffer => {
      // buffer here is a binary representation of the returned image
      console.log(buffer);
      const byteArray = new Uint8Array(buffer);
      const imageBlob = new Blob([byteArray], { type: 'image/jpeg' });
      const imageUrl = URL.createObjectURL(imageBlob);
      console.log(imageUrl)
      var reimaginePicElement = document.getElementById("reimaginePic");
      reimaginePicElement.src = imageUrl;
      reimaginePicElement.style.display='block'
      imgElement.src = imageUrl;
      imgElement.style.display='block'
      var loadingElement = document.getElementById("loading");
      loadingElement.style.display='none'
      displayAllButton()
    })
    .catch(error => {
      console.error('Error:', error.message);

      if (error.response) {
        error.response.json().then(data => {
          console.log('Server Error:', data);
        });
      }
    });
}

function displayimage(img,index){
    img.nextElementSibling.classList.toggle("active");
    
     var thumbnails = document.getElementsByClassName("thumbnail");
    for (var i = 0; i < thumbnails.length; i++) {
      thumbnails[i].classList.remove("highlight");
    }
    img.parentNode.classList.add("highlight");   
    
    
    if(index==0){
        var imgElement = document.getElementById("sourceImage");
        var src = imgElement.src;
        var reimaginePic = document.getElementById("reimaginePic");
        reimaginePic.src = src;
        reimaginePic.style.display='block'          
    }else{
        var imgElement = document.getElementById("reimage"+index);
        var src = imgElement.src;
        var reimaginePic = document.getElementById("reimaginePic");
        reimaginePic.src = src;
        reimaginePic.style.display='block'        
    }


    
}

$(document).ready(function() {
    hiddenAllButton()

    
  var url = window.location.href;
  var queryString = url.split('?')[1];
  var params = new URLSearchParams(queryString);
  var imageUrl = params.get('image_url');
    
    
    var sourceImage = document.getElementById("sourceImage");
      sourceImage.src = imageUrl;
      sourceImage.style.display='block'    

    urlToBlob(imageUrl)
      .then(blob => {
        // 在这里处理Blob对象
        resizeImage(blob)
                .then(resizeBlob => {
                  // 处理缩小后的图像Blob对象
                  console.log(resizeBlob);
                  globalResizedImage = resizeBlob
                  var image1 = document.getElementById("reimage1");
                  reimagine(resizeBlob,image1)
                  var image2 = document.getElementById("reimage2");
                  reimagine(resizeBlob,image2)
                  var image3 = document.getElementById("reimage3");
                  reimagine(resizeBlob,image3)
                })
                .catch(error => {
                  console.error('Error:', error.message);
                });

        
        
      })
      .catch(error => {
        console.error(error);
      });

  
});



function urlToBlob(imageUrl) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', imageUrl, true);
    xhr.responseType = 'blob';

    xhr.onload = function() {
      if (xhr.status === 200) {
        resolve(xhr.response);
      } else {
        reject(new Error('Failed to convert URL to Blob'));
      }
    };

    xhr.onerror = function() {
      reject(new Error('Failed to convert URL to Blob'));
    };

    xhr.send();
  });
}

function hiddenAllButton(){
