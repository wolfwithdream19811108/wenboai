.slider-container {
  position: relative;
  width: 150px;
  margin-top: 20px;

}
.slider-description {
  font-size:11px;
  display: inline-block;

#slider {
  width: 100%;
  background-image: linear-gradient(to right, rgb(0, 255, 236) 0%, rgb(0, 255, 236) calc((var(--value) - 1) * 10%), transparent calc((var(--value) - 1) * 10%), transparent 100%);
  background-size: 100%;
  background-repeat: no-repeat;
  background-position: center bottom;
  border-radius: 10px;
  height: 5px;
}

.slider-value {
  position: absolute;
  top: -20px;
  left: calc((var(--value) - 1) * 10% + 10px);
  transform: translateX(-50%);
  text-align: center;
  color: rgb(0, 255, 236);
}
.baseModels {
    display: flex;
    color: white;
}
#min-value {
  color: rgb(0, 255, 236);
  position: absolute;
  top: -20px;
}
#max-value {
  color: rgb(0, 255, 236);
  position: absolute;
  top: -20px;
  right:-10px;
}

/*自动chatdesign设计遮罩层*/
#chat-design-loading {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.5);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  flex-direction: column;
}

.loader {
  border: 16px solid #f3f3f3;
  border-top: 16px solid rgba(0, 255, 236, 0.71);
  border-radius: 50%;
  width: 120px;
  height: 120px;
  animation: spin 2s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.message {
  color: #fff;
  font-size: 24px;
  margin-top: 20px;
}
