 <script>
 
 
 
 
 function generate(){
     
     
        console.log('生成')
        var loadingElement = document.getElementById("loading");
        loadingElement.style.display='block'
        var reimaginePicElement = document.getElementById("reimaginePic");
        reimaginePicElement.style.display='none'
     
       var canvas = $('#drawingBoard')[0]; // 获取canvas元素
       console.log(canvas.width)
       console.log(canvas.height)
        var type = 'image/png'; // 设置文件类型
        const inputField = document.querySelector('.input-field');
        const inputValue = inputField.value;


        // 将canvas内容转换为Blob对象
        canvas.toBlob(function(blob) {
            // 创建File对象，将Blob对象作为参数传递
            var file = new File([blob], 'canvas_image.png', { type: type });

            // 创建FormData对象，并将File对象附加到FormData中
            var form = new FormData();
            form.append('sketch_file', file);
            form.append('prompt', inputValue);
            console.log("prompt:"+inputValue)

            // 发送POST请求
            fetch('https://clipdrop-api.co/sketch-to-image/v1/sketch-to-image', {
                method: 'POST',
                headers: {
                    'x-api-key': 'ff7a98b864826af3c2a81ca8cf738d1de2f9d2c0a912fb468574ef93940a92ab2b3f5a848ba277a7991111059127324b',
                },
                body: form,
            })
                .then(response => response.arrayBuffer())
                .then(buffer => {
                    const byteArray = new Uint8Array(buffer);
                    const imageBlob = new Blob([byteArray], { type: 'image/jpeg' });
                    const imageUrl = URL.createObjectURL(imageBlob);
                    console.log(imageUrl)
                    var reimaginePicElement = document.getElementById("reimaginePic");
                    reimaginePicElement.src = imageUrl;
                    reimaginePicElement.style.display='block'
                    var loadingElement = document.getElementById("loading");
                    loadingElement.style.display='none'
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }, type);
 }
 
 
 
 
 
 
 
      document.addEventListener('DOMContentLoaded', function () {
        const canvas = document.getElementById('drawingBoard');
        const ctx = canvas.getContext('2d');
        const drawBtn = document.getElementById('drawBtn');
        const eraseBtn = document.getElementById('eraseBtn');
        const clearBtn = document.getElementById('clearBtn');
        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');
        const colorPreview = document.getElementById('colorPreview');
        const toolbar = document.querySelector('.toolbar');
        const inputGroup = document.querySelector('.input-group');
        function resizeCanvas() {
          const viewportHeight = window.innerHeight;
          const toolbarHeight = toolbar.offsetHeight;
          const inputGroupHeight = inputGroup.offsetHeight;

          // 计算画布的正确高度：视口高度减去工具栏和输入框高度
          const canvasHeight = viewportHeight - 100;
          canvas.width = 500;
          canvas.height = 500;
        }
        let drawing = false;
        let startX, startY, endX, endY;
        let tool = 'draw';
        let color = 'black';
        let lineWidth = 8;
        let eraseSize = 8;
        let history = [];
        let redoList = [];
        resizeCanvas();

        let drawings = []; // 存储所有的绘图操作
        let offsetX = 0; // X轴偏移量
        let offsetY = 0; // Y轴偏移量
        let isDragging = false; // 是否正在拖动
        let dragStartX, dragStartY;

        function setActiveToolButton(activeBtn) {
          const buttons = document.querySelectorAll('.tool-btn');
          buttons.forEach((btn) => btn.classList.remove('active'));
          activeBtn.classList.add('active');
        }
        function updateCanvasStyle() {
          ctx.strokeStyle = color;
          ctx.lineWidth = lineWidth;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.globalCompositeOperation =
            tool === 'erase' ? 'destination-out' : 'source-over';
        }

        function saveState() {
          history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
          redoList = [];
          if (history.length > 10) history.shift(); // Limit history array size
        }

        function drawArrow(fromX, fromY, toX, toY) {
          const headLength = 10;
          const dx = toX - fromX;
          const dy = toY - fromY;
          const angle = Math.atan2(dy, dx);
          ctx.moveTo(fromX, fromY);
          ctx.lineTo(toX, toY);
          ctx.lineTo(
            toX - headLength * Math.cos(angle - Math.PI / 6),
            toY - headLength * Math.sin(angle - Math.PI / 6)
          );
          ctx.moveTo(toX, toY);
          ctx.lineTo(
            toX - headLength * Math.cos(angle + Math.PI / 6),
            toY - headLength * Math.sin(angle + Math.PI / 6)
          );
        }

        function drawShape() {
          if (tool === 'line') {
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.stroke();
          } else if (tool === 'rect') {
            ctx.beginPath();
            ctx.rect(startX, startY, endX - startX, endY - startY);
            ctx.stroke();
          } else if (tool === 'circle') {
            const radius = Math.sqrt(
              Math.pow(endX - startX, 2) + Math.pow(endY - startY, 2)
            );
            ctx.beginPath();
            ctx.arc(startX, startY, radius, 0, Math.PI * 2, false);
            ctx.stroke();
          } else if (tool === 'arrow') {
            ctx.beginPath();
            drawArrow(startX, startY, endX, endY);
            ctx.stroke();
          }
        }

        function drawPreview() {
          ctx.putImageData(imageData, 0, 0);
          drawShape(startX, startY, endX, endY);
        }
        setTool('draw');
        function setTool(newTool) {
          tool = newTool;
          setActiveToolButton(
            newTool === 'draw'
              ? drawBtn
              : newTool === 'erase'
              ? eraseBtn
              : newTool === 'line'
              ? lineBtn
              : newTool === 'rect'
              ? rectBtn
              : newTool === 'circle'
              ? circleBtn
              : arrowBtn
          );
          updateCanvasStyle();
        }

        drawBtn.addEventListener('click', function () {
          setTool('draw');
        });

        eraseBtn.addEventListener('click', function () {
          setTool('erase');
        });

        clearBtn.addEventListener('click', function () {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          saveState();
        });

        undoBtn.addEventListener('click', function () {
          if (history.length) {
            redoList.push(history.pop());
            if (history.length) {
              ctx.putImageData(history[history.length - 1], 0, 0);
            } else {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
          }
        });

        redoBtn.addEventListener('click', function () {
          if (redoList.length) {
            history.push(redoList.pop());
            ctx.putImageData(history[history.length - 1], 0, 0);
          }
        });

        canvas.addEventListener('mousedown', function (e) {
          startX = e.offsetX;
          startY = e.offsetY;
          drawing = true;
          imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          if (tool !== 'erase') {
            ctx.beginPath();
            ctx.moveTo(startX, startY);
          }
        });

        canvas.addEventListener('mousemove', function (e) {
          if (!drawing) return;
          endX = e.offsetX;
          endY = e.offsetY;
          if (tool === 'erase') {
            // 保存当前状态
            ctx.save();
            // 为擦除预览绘制一个表示大小的圆圈
            ctx.strokeStyle = 'rgba(100,200,100,1)'; // 设置边框样式为半透明
            ctx.lineWidth = 2; // 设置线宽
            ctx.beginPath();
            ctx.arc(endX, endY, eraseSize / 2, 0, Math.PI * 2);
            ctx.stroke();
            // 设置为擦除模式并擦除路径
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fill();
            // 恢复之前的状态
            ctx.restore();
          } else if (['line', 'rect', 'circle', 'arrow'].includes(tool)) {
            drawPreview();
          } else if (tool === 'draw') {
            ctx.lineTo(endX, endY);
            ctx.stroke();
          }
        });

        canvas.addEventListener('mouseup', function () {
          if (drawing) {
            if (['line', 'rect', 'circle', 'arrow'].includes(tool)) {
              drawShape(startX, startY, endX, endY);
            }
            drawing = false;
            saveState();
          }
        });

        canvas.addEventListener('mouseout', function () {
          if (drawing) {
            if (['line', 'rect', 'circle', 'arrow'].includes(tool)) {
              drawShape(startX, startY, endX, endY);
            }
            drawing = false;
            saveState();
          }
        });
      });
    </script>
