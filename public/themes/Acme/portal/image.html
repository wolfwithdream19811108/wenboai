			imgurl = imgurls[scene]

    			url =url.replace("压缩图","高清")

          //由于大图加载完成以后无需观看图片，而是通过OpenSeadragon加载，所以删除幻灯片节点
          $("#imageGallery").remove();

          page.removeClass('active');
          page.eq(thumbIndex).addClass('active');
        }
