<extend name="public@base"/>

<block name="head">
    {__block__}
    <style>
/* 总体设置(不可更改) */
p, h1, h2, h3, h4 {
    margin: 0;
    padding: 0;
    border: 0;
}

/* 清除浮动 */
.clear {
    clear: both;
    font-size: 0;
    line-height: 0;
    height: 0;
    vertical-align: middle;
}

/* 链接 */
a {
    outline: none;
    text-decoration: none;
    text-decoration: none;
    -webkit-transition: all 0.5s;
    -moz-transition: all 0.5s;
    transition: all 0.5s;
}

a:hover {
    text-decoration: none;
    color: #715125;
}

/* ------------ 画家列表 ------------ */
.partj {
    width: 100%; /* 宽度设置为100%以适应屏幕 */
    max-width: 1200px; /* 限制最大宽度 */
    margin: 0 auto;
    text-align: left;
    padding: 0 0 60px 0;
}

.partj ul {
    display: flex;
    flex-wrap: wrap; /* 确保子元素能够自动换行 */
    justify-content: space-between;
    padding: 0;
    margin: 0;
}

.partj ul li {
    flex: 1 1 19%; /* `flex-grow: 1` 表示可以扩展，`flex-shrink: 1` 表示可以缩小，`flex-basis: 19%` 设置基础宽度 */
    margin-bottom: 20px; /* 项目之间的间距 */
    position: relative;
    border-radius: 10px;
    display: flex;
    flex-direction: column; /* 使项目在垂直方向排列 */
    align-items: center;
    height: 300px; /* 固定高度，避免重叠 */
    box-sizing: border-box; /* 确保 padding 不会影响宽度 */
}

/* 固定尺寸 img_box 和 h3 */
.partj ul li .img_box {
    width: 200px; /* 固定宽度 200px */
    height: 200px; /* 固定高度 200px */
    border-radius: 1000px;
    display: block;
    position: relative;
    top: 0;
    left: 0;
    z-index: 4;
    margin-bottom: 10px; /* 适当的间距，避免上下重叠 */
}

.partj ul li .img_box img {
    height: 100%;
    width: 100%;
    border-radius: 1000px;
}

.partj ul li .img_box h3 {
    width: 200px; /* 固定宽度 200px */
    height: 200px; /* 固定高度 200px */
    position: absolute;
    top: 0;
    left: 0;
    background-color: rgba(0, 0, 0, 0.2);
    font-size: 20px;
    font-weight: 300;
    color: #fff;
    text-align: center;
    padding: 66px 0 0 0;
    z-index: 5;
    border-radius: 1000px;
    font-weight: bold;
}

.partj ul li .img_box h3 font {
    display: block;
    width: 70px;
    font-size: 14px;
    font-weight: 300;
    color: #fff;
    text-align: center;
    margin: 0 auto;
    border-top: 1px solid #fff;
    line-height: 30px;
    margin-top: 4px;
}

/* 在屏幕宽度大于 1200px 时，每行显示 5 个项目 */
@media screen and (min-width: 1200px) {
    .partj ul li {
        flex: 1 1 19%; /* 每行 5 个项目 */
    }
}

/* 在屏幕宽度小于 1024px 时，每行显示 4 个项目 */
@media screen and (max-width: 1024px) {
    .partj ul li {
        flex: 1 1 23%; /* 每行 4 个项目 */
    }
}

/* 在屏幕宽度小于 768px 时，每行显示 3 个项目 */
@media screen and (max-width: 768px) {
    .partj ul li {
        flex: 1 1 31%; /* 每行 3 个项目 */
    }
}

/* 在屏幕宽度小于 480px 时，每行显示 1 个项目 */
@media screen and (max-width: 480px) {
    .partj ul li {
        flex: 1 1 100% !important; /* 每行 1 个项目 */
        height: auto !important; /* 去除固定高度，适应内容 */
    }
}


.intro{
    padding: 100px 30px 0;
    display: inline-block;
    vertical-align: middle;
    color: white;
/*    width: 50%*/
    
}
