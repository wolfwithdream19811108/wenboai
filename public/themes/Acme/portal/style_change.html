<script>


function changestyle(shifttype)
{
    
   var index = layer.load()   
    
    
    
        imageUrl = '<?php echo $imageUrl; ?>'
     
          $.ajax({
        type: "POST",
        //data: formatjsons(key_md5),
        url: "https://www.hongmengyishu.com/portal/searchimage/getStyleShift?shifttype="+shifttype+"&image_url="+imageUrl,
        success: function(ret) {
            layer.close(index)
            var obj = JSON.parse(ret)
            
                   
            document.getElementsByTagName("img")[0].setAttribute("src",obj.image)
           
       
        },
        error:function(){
            layer.close(index)
            alert("失败");
        }
    });      
  
}

function closestyle()
{
    var index = parent.layer.getFrameIndex(window.name)
    parent.layer.close(index)
    //parent.layer.closeAll()
  
}




$(document).ready(function() {
    
    var obj = document.getElementById("stylepic");
    var base64 = '<?php echo $imagebase64; ?>';
    var img = new Image();
    img.src = base64;
    img.onload = function(){
      //  alert('width:'+img.width+',height:'+img.height);
        if(img.width>=img.height){
            obj.setAttribute("width", "95%");
        }else{
            obj.setAttribute("height", "95%");
        }
  
    };    
    
    
    
 
    

});
