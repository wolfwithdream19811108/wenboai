function removeAllChild()
{

$("div.slect-box").click(function(){

    
	if ($(this).children("div.selected-icon")["length"]==0)
	{


			var newNode = document.createElement("div");
			newNode.className  ="selected-icon";
			$(this).append(newNode);
			var newNode = document.createElement("p");
			newNode.className  ="selected-mask";
			$(this).append(newNode);


	}
	var index=$("div.slect-box").index($(this));
	if(lastSelectDiv != null && lastSelectIndex != index ){

		$(lastSelectDiv).children("div.selected-icon").remove();
		$(lastSelectDiv).children("p.selected-mask").remove();
    }
    lastSelectIndex = index;
    lastSelectDiv = this;
