<extend name="public@base"/>
<block name="head">
    {__block__}
    <style>
        .ranking {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .blog-post img {
            width: 50px;
            height: 50px;
        }
    </style>
</block>
<block name="body">
    

        <div class="cation-content">
            <div class="cation-middle">
                <dl class="cation-list">
                    <dt>分类</dt>
                    <dd>
                        <a href="" rel="" name="category" class="all on">全部</a>
						<foreach name="categories" item="vo">
						<a href="" rel="{$vo.id}" name="category" class="default">{$vo.name}</a>
						</foreach>
                    </dd>
                </dl>
                <dl class="cation-list">
                    <dt>博物馆</dt>
                    <dd>
                        <a href="" rel="" name="museum" class="all on">全部</a>
						<foreach name="museums" item="vo">
						<a href="" rel="{$vo.id}" name="museum" class="default">{$vo.museum_name}</a>
						</foreach>
                    </dd>
                </dl>
            </div>
        </div>


    <!--container start-->
	<div class="container">
		<div class="" id="my-gallery-container">
			<foreach name="articles" item="vo">
				<div class="item">
					<notempty name="$vo.more.thumbnail">
						<div  align="center" class="blog-img img">
						    <figure class="effect-ruby">
    							<a href="{:cmf_url('portal/Article/index',['id'=>$vo['id']])}">
    								<img class="img002" src="<?php echo cmf_get_image_url_with_token($vo['more']['thumbnail'],'!300X'); ?>" />
    							</a>
							</figure>
							
						</div>
					</notempty>
						<a href="{:cmf_url('portal/Article/index',['id'=>$vo['id']])}">
							{$vo.post_title}
						</a>
				</div>
			</foreach>	
		</div>
	</div>
	
    <!--container end-->

	<!--分页-->
	<div class="text-center">
        <ul class="pagination">{$page|default=''}</ul>
	</div>

</block>
<block name="scripts">
<script type="text/javascript">

$(document).ready(function() {
    // 获取当前URL参数（解码参数值）
    var getUrlParam = function(name) {
        var results = new RegExp('[\?&]' + name + '=([^&#]*)').exec(window.location.href);
        return results ? decodeURIComponent(results[1]) : null;
    };
    
    // 为所有筛选链接添加点击处理
    $('a[name="category"], a[name="museum"]').on('click', function(e) {
        e.preventDefault();
        
        // 获取当前参数（确保解码）
        var author = getUrlParam('author') || '{$author}';
        var params = {
            author: author,  // 直接使用解码后的值
            page: 1         // 重置分页到第一页
        };
        
        // 添加筛选参数
        var filterType = $(this).attr('name');
        var filterValue = $(this).attr('rel');
        
        if(filterValue) {
            params[filterType] = filterValue;
        }
        
        // 构建新URL（使用encodeURIComponent编码参数值）
        var queryString = Object.keys(params).map(function(key) {
            return encodeURIComponent(key) + '=' + encodeURIComponent(params[key]);
        }).join('&');
        
        var newUrl = "{:cmf_url('portal/artist_article_list/index')}?" + queryString;
        window.location.href = newUrl;
    });
});

</script>

</block>
