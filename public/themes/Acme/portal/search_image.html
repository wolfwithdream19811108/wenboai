    function displayQr(){
         //alert(111)
       //  $('#miniporgram-qr').css("display","block");
         $('#miniporgram-qr').fadeIn(1500);
    }
    function dismissQr(){
        //$('#miniporgram-qr').css("display","none");
        $('#miniporgram-qr').fadeOut(1500);
    }

    function search_image() {
  
      var image_url = $(".graph-d20-search-wrapper-input").val();
      if(image_url==""){
            layer.msg(
              "请上传图片或者粘贴图片网址",
              {
                icon: 1,
                time: 2000, //2秒关闭（如果不配置，默认是3秒）
              },
              function () {}
            );
            return 
      }else if (image_url.search("/portal/") == -1 && image_url.search("http") == -1) {
        image_url = "https://www.hongmengyishu.com/upload/" + image_url;
/*        var searchImgUrlObj = document.getElementById("searchImgUrl");  
        searchImgUrlObj.src = image_url;*/
      } 
      var href ="{:url('portal/searchimage/index')}" + "?image_url=" + image_url;
      window.location = href;
      var index = layer.load();
    }

     function uploadImage() {
        uploadOneImage('图片上传','#image_url','image_url','portal',search_image)
    }
    
    

    $(document).ready(function () {
     
      error = "<?php echo $error; ?>";

          {
