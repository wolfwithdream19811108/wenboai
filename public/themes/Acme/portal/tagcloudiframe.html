<!DOCTYPE html>

  <head>
    <title>jQCloud Example with Floating Effect</title>
    <style type="text/css">
      /* 添加飘动动画效果 */
      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(2deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      
      div.jqcloud span {
        animation: float 5s ease-in-out infinite;
        display: inline-block;
      }
      
      /* 为不同位置的词添加不同的动画延迟 */
      div.jqcloud span:nth-child(odd) {
        animation-delay: 0.5s;
      }
      div.jqcloud span:nth-child(3n) {
        animation-delay: 1s;
      }
      div.jqcloud span:nth-child(5n) {
        animation-delay: 1.5s;
      }
      
      /* 自定义链接样式 */
      div.jqcloud a {
        text-decoration: none;
      }
      
      /* 确保容器填满 */
     #my_favorite_latin_words {
        width: 1000px;
        height: 600px;
        border: 1px solid #ccc;
        overflow: hidden;
        margin: 0 auto; /* 水平居中 */
      }
    </style>
