
<block name="head">

  <style>

    .graph-d20-search-wrapper-camera {
      position: absolute;
      right: 16px;
      width: 24px;
      height: 24px;
      margin-top: 8px;

        no-repeat;
      background-size: contain;
    }
    .graph-d20-search-wrapper-camera-title {
      display: none;
      width: 84px;
      height: 34px;
      line-height: 35px;
      font-size: 13px;
      text-align: center;
      background: #fff;
      position: absolute;
      right: -16px;
      bottom: -44px;
      -webkit-box-shadow: 0 2px 10px 0 rgba(0, 0, 0, 0.1);
      box-shadow: 0 2px 10px 0 rgba(0, 0, 0, 0.1);
      border-radius: 6px;
    }
    .graph-d20-search-wrapper-camera-selected,

      cursor: pointer;
      background: url(https://mms-graph.cdn.bcebos.com/activity/pc/cameraSel.png)
        no-repeat;
      background-size: contain;
    }
    .graph-d20-search-wrapper-camera:hover

      display: block;
    }
    .graph-d20-search-wrapper-camera-result {
      margin-top: 6px;
    }
    .graph-d20-search-wrapper-error {
      position: absolute;
      top: 0;
      right: 15px;
      font-size: 14px;
      color: #9195a3;
      padding-left: 20px;
      height: 40px;
      line-height: 40px;
      background: #fff

      background-size: 16px 16px;
    }
    .graph-d20-search-wrapper-error-result {
      height: 36px;
      line-height: 36px;
    }
    .graph-d20-search-btn {

    .graph-d20-search-btn:hover {
      background: #3eb798;
    }
    .graph-d20-search-btn-result {
      width: 112px;
      height: 40px;

    }
    .graph-d20-search-layer {

      left: 0;

      border-radius: 12px;
      color: #9195a3;
      font-size: 13px;
    }
    .graph-d20-search-layer-loading {
      text-align: center;
      margin-top: 45px;
      margin-bottom: 45px;
    }

      line-height: 1;

      margin-bottom: 33px;

    .graph-d20-search-layer-error > p {
      padding: 0 65px;
    }
    .graph-d20-search-layer-error-text {
      display: inline-block;
      word-break: break-all;
      height: auto;
      line-height: 16px;
      font-size: 0;

      padding: 1px 0;
      background: url(https://mms-graph.cdn.bcebos.com/activity/pc/waring.png)
        no-repeat 0 0;
      background-size: 16px 16px;
    }
    .graph-d20-search-layer-error-text > span {
      font-size: 13px;
    }

      color: #315efb;
    }
    .graph-d20-search-layer-error-reupload:hover {
      cursor: pointer;
    }
    .graph-d20-search-layer-error-format {
      font-size: 13px;
      margin-top: 7px;
    }
    .graph-d20-search-layer-contain {
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -ms-flex-direction: column;
      flex-direction: column;
      -webkit-box-flex: 1;
      -ms-flex: 1;
      flex: 1;
      margin-left: 24px;
      margin-right: 24px;
    }
    .graph-d20-search-layer-drag {
      height: 60px;
      line-height: 60px;
      margin-top: 24px;
      text-align: center;

      border-radius: 6px;
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
    }
    .graph-d20-search-layer-drag-dragover {

    }

      position: relative;
      width: 78px;
      height: 30px;
      line-height: 31px;
      text-align: center;
      color: #fff;
      margin: 16px auto 24px;
      background: #4e6ef2;
      border-radius: 6px;
    }
    .banner-descr-text {

      color: #fff;
      top: 380px;
      font-size: 17px;
      letter-spacing: 8px;
      font-weight: 600;
      line-height: 1;
    }
    .graph-d20-search-layer-choose:active,
    .graph-d20-search-layer-choose:hover {
      background: #4662d9;
    }
    .graph-d20-search-layer-close {
      position: absolute;
      bottom: 16px;
      right: 16px;
      display: inline-block;
      width: 16px;
      height: 16px;
      background: url(https://mms-graph.cdn.bcebos.com/activity/pc/close.png)
        no-repeat;
      background-size: 16px 16px;
      cursor: pointer;
    }
    .graph-d20-search-layer-close:hover {
      background: url(https://mms-graph.cdn.bcebos.com/activity/pc/closeSel.png)
        no-repeat;
      background-size: 16px 16px;
    }

    .banner-text {
      position: absolute;
      color: #fff;
/*      left: 52%;
      -webkit-transform: translateX(-50%);
      transform: translateX(-50%);*/
      top: 300px;
      font-size: 56px;
      letter-spacing: 8px;
      font-weight: 600;
      line-height: 1;
    }
    .banner-search-img {
      position: absolute;
      color: #fff;
      left: 52%;
      -webkit-transform: translateX(-50%);
      transform: translateX(-50%);
      top: 550px;
      font-size: 56px;
      letter-spacing: 8px;
      font-weight: 600;
      line-height: 1;
      box-shadow: 0px 0 35px #0d0d0d;
    }
    .banner-qr-img {
      position: absolute;
      display: none;
      color: #fff;
      right: 1px;
      -webkit-transform: translateX(-50%);
      transform: translateX(-50%);
      top: 550px;
      box-shadow: 0px 0 35px #0d0d0d;
    }
    .graph-d20-search-wrapper-input-focus {
      border: 2px solid #4e6ef2 !important;
      border-right: 0 !important;
    }
    .graph-d20-search-wrapper-input-result {
      padding: 10px 0;
    }
