<!DOCTYPE html>
<html>
<head>
    <title>{$tag.name}  {$site_info.site_name|default=''}</title>
    <meta name="keywords" content="{$site_info.site_seo_keywords|default=''}"/>
    <meta name="description" content="{$site_info.site_seo_description|default=''}">
    <include file="public@head"/>
    <hook name="before_head_end"/>
</head>
<body class="body-white">
<div class="container">
    <php>$demo_time=2;</php>
    <h1>{$tag.name}</h1>
    <hr>
    <div class="row">
        <div class="col-md-9">
            <div class="">
                <php>
                    $where=[
                    'post.create_time'=>['egt',0]
                    ];
                    $page=[
                        'list_rows'=>20,
                        'next'=>'下一页',
                    'prev'=>'上一页'
                    ];
                </php>
                <portal:tagArticles item="vo" where="$where" order="post.create_time DESC" page="$page"
                                 relation="categories"
                                 tagId="$tag.id"
                                 returnVarName="articles_data">
                    <div class="list-boxes">
                        <notempty name="$vo.thumbnail">
                            <a href="{:cmf_url('portal/Article/index',['id'=>$vo['id'],'cid'=>1])}">
                                <img src="{$vo.thumbnail|cmf_get_image_url}"/>
                            </a>
                        </notempty>
                        <h2><a href="{:cmf_url('portal/Article/index',array('id'=>$vo['id']))}">{$vo.post_title}</a>
                        </h2>
                    </div>
                </portal:tagArticles>

            </div>
            <ul class="pagination">
                <page/>
            </ul>
        </div>
    </div>

    <include file="public@footer"/>
</div>

<include file="public@scripts"/>
<hook name="before_body_end"/>
</body>
</html>
