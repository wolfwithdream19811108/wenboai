			</div>
		

			<div class="" id="my-gallery-container">
				<foreach name="articles" item="vo">
					<div class="item">
						<notempty name="$vo.more.thumbnail">
							<div  align="left" class="blog-img img">
							    <figure class="effect-ruby">
    								<a href="{:cmf_url('portal/Article/index',['id'=>$vo['id']])}">
                                    	<if condition="$vo['firstpic_width'] gt $vo['firstpic_height']*8 ">
                                          <img class="img002" src="<?php echo cmf_get_image_url_with_token($vo['more']['thumbnail'],'!longimg'); ?>" />
                                       <elseif condition="$vo['firstpic_height'] gt $vo['firstpic_width']*6" />
                                          <img class="img002" src="<?php echo cmf_get_image_url_with_token($vo['more']['thumbnail'],'!shuimg'); ?>" />
                                        <else />
    									  <img class="img002" src="<?php echo cmf_get_image_url_with_token($vo['more']['thumbnail'],'!300X'); ?>" />
                                        </if>
    								</a>
    							</figure>
							</div>
						</notempty>

							</a>
					</div>
				</foreach>

		<div class="text-center">
			<ul class="pagination">{$page|default=''}</ul>
		</div>

<block name="scripts">
<script type="text/javascript">

$(document).ready(function() {
	category = '<?php echo $category; ?>'
	pageIsOver = '<?php echo $pageIsOver; ?>'
	total_pages = '<?php echo $total_pages; ?>'
	if (category == 0)
	{
		var filter=document.getElementById("filter");
		var child=document.getElementById("museumlist");
		filter.removeChild(child);
	}

	if(pageIsOver)
	{
        const url = new URL(window.location.href);
        url.searchParams.set('page', '1'); // 强制设置 page=1
        window.location.href = url.toString();
	}
	if(total_pages==0)
	{
	    	layer.msg('无更多作品，请重新筛选作品', {
            	  icon: 1,
            	  time: 2000 //2秒关闭（如果不配置，默认是3秒）
            	}, function(){
                });
	}
	

 
  });


</script>

</block>
