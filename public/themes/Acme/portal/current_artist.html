    <!--container start-->

            <!--blog start-->

						<li data-thumb="<?php echo cmf_get_image_url_with_token($vo['url'],'!w300'); ?>" data-src="">

                                    <img  data-original="<?php echo cmf_get_image_url_with_token($vo['url']); ?>" src="<?php echo cmf_get_image_url_with_token($vo['url'],'!w400'); ?>" />

<block name="scripts">
  
<script>

 
	var viewer = new Viewer(document.getElementById('imageGallery'), {
		url: 'data-original',
		maxZoomRatio:50,
		title:true,
		show: function() {
		 //  fullScreen();
		},
		viewed: function() {
		   viewer.fullImage($(document).width()-100);
		},
		hide: function() {
	//	   fullScreen();
		}
	});


	$(document).ready(function() {
		$('#imageGallery').lightSlider({
		gallery:true,
		minSlide:1,
		maxSlide:1,
		currentPagerPosition:'centercenter'  
		});  

	});



</script>
