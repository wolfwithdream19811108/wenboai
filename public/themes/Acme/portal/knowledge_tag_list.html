<extend name="public@base" />

<block name="head">
  {__block__}
  <style>
    .box {
      text-align: center;
     /* overflow: hidden;*/
      color: #fff;
      position: relative;
     /* margin-top: 20px;*/
     margin:10px;
     width:200px;
     display: inline-block;
    }
    .box:after {
      content: "";
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0.08) 69%,
        rgba(0, 0, 0, 0.76) 100%
      );
      position: absolute;
      top: 0;
      left: 0;
      transition: all 0.5s ease 0s;
      pointer-events: none;
    }
    .box:hover:after {
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.01) 0%,
        rgba(0, 0, 0, 0.09) 11%,
        rgba(0, 0, 0, 0.12) 13%,
        rgba(0, 0, 0, 0.19) 20%,
        rgba(0, 0, 0, 0.29) 28%,
        rgba(0, 0, 0, 0.29) 29%,
        rgba(0, 0, 0, 0.42) 38%,
        rgba(0, 0, 0, 0.46) 43%,
        rgba(0, 0, 0, 0.53) 47%,
        rgba(0, 0, 0, 0.75) 69%,
        rgba(0, 0, 0, 0.87) 84%,
        rgba(0, 0, 0, 0.98) 99%,
        rgba(0, 0, 0, 0.94) 100%
      );
    }
    .box img {
      width: 100%;
      height: auto;
    }
    .box .box-content {
      width: 100%;
      padding: 20px;
      margin-bottom: 20px;
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 1;
    }
    .box .title {
      font-size: 20px;
      font-weight: bold;
      color: white;
      margin: 0 0 15px 0;
      transform: translateY(50px);
      transition: all 0.4s cubic-bezier(0.13, 0.62, 0.81, 0.91) 0s;
    }
    .box .post {
      display: block;
      padding: 8px 0;
      font-size: 15px;
      transform: translateY(50px);
      transition: all 0.4s cubic-bezier(0.13, 0.62, 0.81, 0.91) 0s;
    }
    .box:hover .title,
    .box:hover .post {
      transform: translateY(0);
    }

 
    @media only screen and (max-width: 990px) {
      .box {
        margin-bottom: 30px;
      }
    }
  </style>
</block>
<block name="body">
<div class="container">
    
    <foreach name="tagsGroup" item="tags">
    <div class="float2" style="clear: both;">
        <div class="header-title" style="text-align: center">
        <h1 style="font-weight: bold">{$tags.knowledge}</h1>
        </div>
        <div class="float" style="text-align: center;">
            <foreach name="tags.list" item="vo">
                <div class="box">
                    <a href="/portal/tagpostlist/index/tag/{$vo['tag']}.html">
                      <img src="{$vo.pic}" />
                    </a>
                    <div class="box-content">
                      <a href="/portal/tagpostlist/index/tag/{$vo['tag']}.html">
                        <h3 class="title">{$vo.tag}</h3>
                      </a>
                    </div>
                </div>
            </foreach>
        </div>
    </div>
    </foreach>
    

 </div>

</block>

</block>
