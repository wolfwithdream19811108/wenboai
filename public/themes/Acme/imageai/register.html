<!doctype html><html><head><include file="imageai@_head"/></head><body><include file="imageai@_nav"/>
<main class="container"><section class="auth-card"><h1>注册开发者账号</h1><div class="notice warning">此入口注册的账号仅能通过 API 创建图片，不能使用网页生图。</div><form id="register-form"><div class="field"><label>本人手机号码</label><input id="mobile" name="mobile" required></div><div class="field"><label>短信验证码</label><div class="field-row"><input name="code" required><button id="send-code" type="button" class="btn">获取验证码</button></div></div><div id="send-captcha-element"></div><div class="field"><label>设置登录密码</label><input name="password" type="password" minlength="8" maxlength="32" required></div><label><input type="checkbox" name="agree_service" value="1" required> 我已阅读并同意<a href="/imageai/service" target="_blank">服务协议</a></label><br><label><input type="checkbox" name="agree_privacy" value="1" required> 我已阅读并同意<a href="/imageai/privacy" target="_blank">隐私政策</a></label><button id="register-submit" type="submit" class="btn btn-primary btn-block" style="margin-top:18px">注册</button></form><p class="help">已有账号？<a href="/imageai/login">立即登录</a></p></section></main>
<script src="https://o.alicdn.com/captcha-frontend/aliyunCaptcha/AliyunCaptcha.js"></script><script src="__TMPL__/public/assets/js/imageai/auth.js?v=20261028-3"></script><script>ImageAIAuth.initSendCaptcha('#send-code','#send-captcha-element','#mobile','register');ImageAIAuth.bindPlainForm('#register-form','/imageai/register/submit');</script>
</body></html>
