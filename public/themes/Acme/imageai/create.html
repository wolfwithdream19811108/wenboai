                            <option selected value="请生成一件清代时期的漆器剔犀盘，采用螺钿镶嵌、磨漆工艺制作，器物线条流畅，装饰有莲瓣纹纹样，器物在墓葬场景中，置于春节庙会中，器物造型独特、器物细腻温润。">清代漆器 · 剔犀盘</option>
