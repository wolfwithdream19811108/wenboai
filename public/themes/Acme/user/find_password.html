<extend name="public@base"/>
<block name="body">

<div class="container tc-main">
  <div class="row">
    <div class="col-md-4 col-md-offset-4">
      <h2 class="text-center">忘记密码</h2>

      <form class="js-ajax-form" action="{:url('user/Login/passwordReset')}" method="post" id="password-reset-form">

        <!-- 切换方式 -->
        <notempty name="theme_vars.enable_mobile">
          <ul class="nav nav-tabs nav-justified" style="margin-bottom: 15px;">
            <li class="active"><a href="#mobile" data-toggle="tab">通过手机找回</a></li>
<!--            <li><a href="#email" data-toggle="tab">通过邮箱找回</a></li>-->
          </ul>
        </notempty>

        <!-- tab内容（两者暂时都保留 name，JS 会在加载时修正） -->
        <div class="tab-content">
          <div class="tab-pane active" id="mobile">
            <div class="form-group">
              <input type="text" name="username" placeholder="手机号" class="form-control"
                     id="js-mobile-input">
            </div>
          </div>

          <div class="tab-pane" id="email">
            <div class="form-group">
              <input type="text" name="username" placeholder="邮箱" class="form-control"
                     id="js-email-input">
            </div>
          </div>
        </div>

        <!-- 密码 -->
        <div class="form-group">
          <input type="password" name="password" placeholder="密码" class="form-control" required>
        </div>

        <!-- 验证码输入和获取按钮（共用） -->
        <div class="form-group" style="position: relative;">
          <input type="text" name="verification_code" placeholder="验证码" style="width:170px;"
                 class="form-control" required>
          <div id="verifybutton" class="btn btn-success js-get-code-nocaptcha"
               style="width: 160px;position: absolute;top:0;right: 0;height:38px;
                      text-align:center;line-height:25px;color:#fff;"
               data-wait-msg="[second]秒后才能再次获取"
               data-url="{:url('user/VerificationCode/send')}"
               >获取验证码</div>
        </div>

        <!-- 提交 -->
        <div class="form-group">
          <button class="btn btn-primary btn-block js-ajax-submit" type="submit">确定</button>
        </div>

      </form>
    </div>
  </div>
</div>

<!-- 如果你已经在 base 模板里引入了 jQuery & bootstrap，则不需要再次引入 -->
<script type="text/javascript" src="https://o.alicdn.com/captcha-frontend/aliyunCaptcha/AliyunCaptcha.js"></script>
<script>
  (function($){
    // 确保页面 ready 后执行
    $(function(){

      // 将非激活的 username input 禁用并移除 name，只保留激活的那个（避免重复提交）
      function updateUsernameField(){
        var activeId = $('.tab-pane.active').attr('id');
        if (activeId === 'mobile') {
          $('#js-mobile-input').prop('disabled', false).attr('name', 'username');
          $('#js-email-input').prop('disabled', true).removeAttr('name');
        } else {
          $('#js-email-input').prop('disabled', false).attr('name', 'username');
          $('#js-mobile-input').prop('disabled', true).removeAttr('name');
        }
      }

      // 页面初始化时修正（避免初次提交时重复）
      updateUsernameField();

      // 每次切 tab 后修正
      $('a[data-toggle="tab"]').on('shown.bs.tab', function () {
        updateUsernameField();
      });

      // 在表单提交前再次确保只有一个 username 被提交（额外保险）
      $('#password-reset-form').on('submit', function(){
        updateUsernameField();
      });


      /* ----------------- 下面是你原来的验证码 / 阿里滑块逻辑（保持不变，只是引用） ----------------- */

      var captcha;
      var verifyCodeSecond;

      initAliyunCaptcha({
        SceneId: '1doig5bf',
        prefix: '9pvdp9',
        mode: 'popup',
        element: '#captcha-element',
        button: '#verifybutton',
        captchaVerifyCallback: captchaVerifyCallback,
        onBizResultCallback: onBizResultCallback,
        getInstance: getInstance,
        slideStyle: { width: 360, height: 40 },
        language: 'cn',
        region: 'cn'
      });

      function getInstance(instance) { captcha = instance; }

      function captchaVerifyCallback(captchaVerifyParam, callback) {
        fetch('/api/portal/user/captcha', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ captchaVerifyParam: captchaVerifyParam })
        })
        .then(response => response.json())
        .then(result => {
          callback({ captchaResult: result.data.verifyResult });
        })
        .catch(error => {
          console.error('验证码校验失败:', error);
          callback({ captchaResult: false });
        });
      }

      function onBizResultCallback(bizResult) {
        if (bizResult !== true) {
          alert('业务验证不通过！');
          return;
        }

        var $verifybutton = $('#verifybutton');
        if ($verifybutton.data('loading') || $verifybutton.data('sending')) {
          layer.msg('正在发送验证码，请稍后再试', {icon: 1, time: 2000});
          return;
        }

        // 根据当前激活 tab 取对应的输入框值
        var activeTab = $('.tab-pane.active');
        var $input = (activeTab.attr('id') === 'mobile') ? $('#js-mobile-input') : $('#js-email-input');
        var value = $input.val();
        if (!value) {
          $input.focus();
          return;
        }

        $verifybutton.data('loading', true);
        $verifybutton.data('sending', true);

        var url = $verifybutton.data('url');
        var init_secode_left = parseInt($verifybutton.data('init-second-left')) || 60;
        var init_text = $verifybutton.text();
        var wait_msg = $verifybutton.data('wait-msg');
        var codeType = $verifybutton.data('type');

        $.ajax({
          url: url,
          type: 'POST',
          dataType: 'json',
          data: {username: value, type: codeType},
          success: function (data) {
            if (data.code == 1) {
              noty({text: data.msg, type: 'success', layout: 'center'});
              $verifybutton.text(wait_msg.replace('[second]', init_secode_left));
              verifyCodeSecond = init_secode_left;
              var mtimer = setInterval(function () {
                if (init_secode_left > 0) {
                  init_secode_left--;
                  verifyCodeSecond--;
                  $verifybutton.text(wait_msg.replace('[second]', init_secode_left));
                } else {
                  clearInterval(mtimer);
                  $verifybutton.text(init_text);
                  $verifybutton.data('sending', false);
                }
              }, 1000);
            } else {
              noty({text: data.msg, type: 'error', layout: 'center'});
              $verifybutton.data('sending', false);
            }
          },
          error: function () {
            $verifybutton.data('sending', false);
          },
          complete: function () {
            $verifybutton.data('loading', false);
          }
        });

      } // onBizResultCallback

    }); // document ready
  })(jQuery);
</script>
</block>
