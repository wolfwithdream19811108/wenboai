<extend name="public@base"/>
<block name="head">
    <style>
        .ranking {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .blog-post img{
            width: 50px;
            height: 50px;
        }
        /* 新增样式：限制上传图片显示区域 */
        .uploaded_avatar_area img {
            max-width: 500px;
            max-height: 500px;
        }
        /* 添加裁剪区域容器样式 */
        .jcrop-container {
            margin: 20px 0;
        }
    </style>
</block>
<block name="body">
<div class="container tc-main">
    <div class="row">
        <div class="col-md-3">
            <include file="public@usernav"/>
        </div>
        <div class="col-md-9">
            <div class="tabs">
                <ul class="nav nav-tabs">
                    <li class="active"><a href="#one" data-toggle="tab"><i class="fa fa-user"></i> 修改头像</a></li>
                </ul>
                <div class="tab-content">
                    <div class="tab-pane active" id="one">
                        <br>
                        <if condition="empty($avatar)">
                            <img src="__TMPL__/public/assets/images/headicon_128.png" class="headicon" width="128"/>
                            <else/>
                            <img src="{:cmf_get_user_avatar_url($avatar)}?t={:time()}" class="headicon" width="128"/>
                        </if>
                        <br><br>
                        <input type="file" onchange="avatar_upload(this)" id="avatar_uploder" name="file"/>
                        <div class="uploaded_avatar_area">
                            <div class="uploaded_avatar_btns">
                                <a class="btn btn-primary confirm_avatar_btn" onclick="update_avatar()">确定</a>
                                <a class="btn" onclick="reloadPage()">取消</a>
                            </div>
                        </div>
                        <p class="help-block">头像支持jpg,png,jpeg格式,文件大小最大不能超过1M</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- /container -->

<include file="public@scripts"/>
<script type="text/javascript">
    function update_avatar() {
        var area = $(".uploaded_avatar_area img").data("area");
        console.log(area);
        $.post("{:url('Profile/avatarUpdate')}", area, function (data) {
            if (data.code == 1) {
                reloadPage(window);
            }
        }, "json");
    }
    
    function avatar_upload(obj) {
        var $fileinput = $(obj);
        Wind.css("jcrop");
        Wind.use("ajaxfileupload", "jcrop", "noty", function () {
            $.ajaxFileUpload({
                url: "{:url('Profile/avatarUpload')}",
                secureuri: false,
                fileElementId: "avatar_uploder",
                dataType: 'json',
                data: {},
                success: function (data, status) {
                    if (data.code == 1) {
                        $("#avatar_uploder").hide();
                        var $uploaded_area = $(".uploaded_avatar_area");
                        $uploaded_area.find("img").remove();
                        var src  = "__ROOT__/upload/" + data.data.file;
                        var $img = $("<img/>").attr("src", src).css({
                            'max-width': '500px',
                            'max-height': '500px'
                        });
                        $img.prependTo($uploaded_area);
                        $(".uploaded_avatar_btns").show();
                        var img = new Image();
                        img.src = src;

                        var callback = function () {
                            // 添加裁剪区域容器
                            var $jcropContainer = $('<div class="jcrop-container"></div>');
                            $img.wrap($jcropContainer);
                            
                            $img.Jcrop({
                                aspectRatio: 1,
                                trueSize: [img.width, img.height],
                                setSelect: [0, 0, 200, 200], // 设置初始选择区域大小
                                minSize: [100, 100], // 设置最小选择区域
                                boxWidth: 500, // 限制裁剪区域宽度
                                boxHeight: 500, // 限制裁剪区域高度
                                onSelect: function (c) {
                                    $img.data("area", c);
                                }
                            });
                        }

                        if (img.complete) {
                            callback();
                        } else {
                            img.onload = callback;
                        }

                    } else {
                        noty({
                            text: data.msg,
                            type: 'error',
                            layout: 'center',
                            callback: {
                                afterClose: function () {
                                    reloadPage(window);
                                }
                            }
                        });
                    }
                },
                error: function (data, status, e) {
                }
            });
        });
        return false;
    }
</script>
</block>
