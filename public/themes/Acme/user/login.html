<script>
window.AliyunCaptchaConfig = {
    region: 'cn',
    prefix: '9pvdp9'
};
</script>

<script src="https://o.alicdn.com/captcha-frontend/aliyunCaptcha/AliyunCaptcha.js"></script>

<script>
const loginForm = document.getElementById('login-form');
const loginButton = document.getElementById('verifybutton');
const loginMessage = document.getElementById('login-message');

let captcha;
let loginPending = false;
let loginResponse = null;

// 阻止普通表单提交，登录统一经过滑块回调。
loginForm.addEventListener('submit', function (event) {
    event.preventDefault();
});

// 回车也走滑块验证。
loginForm.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' && !event.isComposing) {
        event.preventDefault();

        if (!loginPending) {
            loginButton.click();
        }
    }
});

// 在验证码按钮处理之前检查必填项和重复提交。
loginButton.addEventListener('click', function (event) {
    const username = loginForm.elements.username.value;
    const password = loginForm.elements.password.value;

    if (
        loginPending
        || username.trim() === ''
        || password === ''
    ) {
        event.preventDefault();
        event.stopImmediatePropagation();

        if (!loginPending) {
            loginMessage.textContent = '请输入用户名和密码';
        }
    }
}, true);

initAliyunCaptcha({
    SceneId: '1doig5bf',
    prefix: '9pvdp9',
    region: 'cn',
    mode: 'popup',
    element: '#captcha-element',
    button: '#verifybutton',

    captchaVerifyCallback: captchaVerifyCallback,
    onBizResultCallback: onBizResultCallback,

    getInstance: function (instance) {
        captcha = instance;
    },

    slideStyle: {
        width: 360,
        height: 40
    },

    language: 'cn',
    autoRefresh: true
});

// 同一次业务请求提交账号、密码和阿里云验证参数。
async function captchaVerifyCallback(captchaVerifyParam) {
    if (loginPending) {
        return {
            captchaResult: false,
            bizResult: false
        };
    }

    loginPending = true;
    loginButton.disabled = true;
    loginResponse = null;
    loginMessage.textContent = '';

    try {
        const response = await fetch(loginForm.action, {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
                'Content-Type':
                    'application/x-www-form-urlencoded',
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: new URLSearchParams({
                username: loginForm.elements.username.value,
                password: loginForm.elements.password.value,
                captchaVerifyParam: captchaVerifyParam
            })
        });

        if (!response.ok) {
            throw new Error('登录服务暂时不可用，请重试');
        }

        const result = await response.json();

        if (
            !result.data
            || typeof result.data.captchaResult !== 'boolean'
            || typeof result.data.bizResult !== 'boolean'
        ) {
            throw new Error(
                '登录接口返回格式错误，请检查后端更新'
            );
        }

        loginResponse = result;

        const captchaPassed =
            result.data.captchaResult === true;

        const loginPassed =
            captchaPassed
            && result.code === 1
            && result.data.bizResult === true;

        if (!loginPassed) {
            loginMessage.textContent =
                result.msg || '登录失败，请重试';
        }

        return {
            captchaResult: captchaPassed,
            bizResult: loginPassed
        };
    } catch (error) {
        loginMessage.textContent =
            error.message || '登录失败，请重试';

        return {
            captchaResult: false,
            bizResult: false
        };
    } finally {
        loginPending = false;
        loginButton.disabled = false;
    }
}

// 登录已经在上一个请求中完成，这里只负责跳转。
function onBizResultCallback(bizResult) {
    if (
        bizResult === true
        && loginResponse
        && loginResponse.code === 1
        && loginResponse.data.captchaResult === true
        && loginResponse.data.bizResult === true
    ) {
        let target = new URL('/', window.location.origin);

        try {
            const candidate = new URL(
                loginResponse.url || '/',
                window.location.origin
            );

            if (candidate.origin === window.location.origin) {
                target = candidate;
            }
        } catch (error) {
            // 地址无效时使用首页。
        }

        window.location.assign(target.href);
    }
}
</script>
