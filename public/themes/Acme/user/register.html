<script type="text/javascript" src="https://o.alicdn.com/captcha-frontend/aliyunCaptcha/AliyunCaptcha.js"></script>
<script>
  let captcha;
  var verifyCodeSecond;
  // 弹出式
  initAliyunCaptcha({
    SceneId: '1doig5bf', // 场景ID。根据步骤二新建验证场景后，您可以在验证码场景列表，获取该场景的场景ID
    prefix: '9pvdp9', // 身份标。开通阿里云验证码2.0后，您可以在控制台概览页面的实例基本信息卡片区域，获取身份标
    mode: 'popup', // 验证码模式。popup表示要集成的验证码模式为弹出式。无需修改
    element: '#captcha-element', //页面上预留的渲染验证码的元素，与原代码中预留的页面元素保持一致。
    button: '#verifybutton', // 触发验证码弹窗的元素。button表示单击登录按钮后，触发captchaVerifyCallback函数。您可以根据实际使用的元素修改element的值
    captchaVerifyCallback: captchaVerifyCallback, // 业务请求(带验证码校验)回调函数，无需修改
    onBizResultCallback: onBizResultCallback, // 业务请求结果回调函数，无需修改
    getInstance: getInstance, // 绑定验证码实例函数，无需修改
    slideStyle: {
      width: 360,
      height: 40,
    }, // 滑块验证码样式，支持自定义宽度和高度，单位为px。其中，width最小值为320 px
    language: 'cn', // 验证码语言类型，支持简体中文（cn）、繁体中文（tw）、英文（en）
    region: 'cn' //验证码示例所属地区，支持中国内地（cn）、新加坡（sgp）
  });

  // 绑定验证码实例函数。该函数为固定写法，无需修改
  function getInstance(instance) {
    captcha = instance;
  }

  // 业务请求(带验证码校验)回调函数
  /**
   * @name captchaVerifyCallback
   * @function
   * 请求参数：由验证码脚本回调的验证参数，不需要做任何处理，直接传给服务端即可
   * @params {string} captchaVerifyParam
   * 返回参数：字段名固定，captchaResult为必选；如无业务验证场景时，bizResult为可选
   * @returns {{captchaResult: boolean, bizResult?: boolean|undefined}} 
   */
    function captchaVerifyCallback(captchaVerifyParam, callback) {
      // formData.append('yourBizParam', yourBizValue); // 添加其他业务参数
      // 1.向后端发起业务请求，获取验证码验证结果和业务结果
      fetch('/api/portal/user/captcha', {
        method: 'POST', // 指定请求方法为POST
        headers: {
          'Content-Type': 'application/json', // 设置请求头，告诉服务器发送的是JSON数据
        },
        body: JSON.stringify({ captchaVerifyParam: captchaVerifyParam }) // 将参数转换为JSON字符串
      })
      .then(response => {
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        return response.json(); // 解析JSON响应体
      })
      .then(result => {
        // 2.构造标准返回参数
        var verifyResult = {
          captchaResult: result.data.verifyResult
        };
        // 调用回调函数，传入验证结果
        callback(verifyResult);
      })
      .catch(error => {
        console.error('There was a problem with the fetch operation:', error);
      });
    }

  // 业务请求验证结果回调函数
  function onBizResultCallback(bizResult) {
    if (bizResult === true) {
      // 如果业务验证通过，跳转到对应页面。此处以跳转到https://www.aliyun.com/页面为例
        console.log("发送验证码")
      
      
        
        var $js_get_mobile_code_nocaptcha = $('.js-get-mobile-code-nocaptcha');
        if ($js_get_mobile_code_nocaptcha.data('loading')||$js_get_mobile_code_nocaptcha.data('sending')){
          layer.msg('正在发送验证码，请稍后再试', {
            	  icon: 1,
            	  time: 2000 //2秒关闭
            	});           
            return;
        } 
        var $mobile_input = $($js_get_mobile_code_nocaptcha.data('mobile-input'));
        var mobile        = $mobile_input.val();
        if (mobile == '') {
            $mobile_input.focus();
            return;
        }
        
        var $form           = $js_get_mobile_code_nocaptcha.parents('form');
        
        
        
        $js_get_mobile_code_nocaptcha.data('loading', true);
        $js_get_mobile_code_nocaptcha.data('sending', true);
        
        var url = $js_get_mobile_code_nocaptcha.data('url');
        
        var init_secode_left = parseInt($js_get_mobile_code_nocaptcha.data('init-second-left'));
        init_secode_left     = init_secode_left > 0 ? init_secode_left : 60;
        
        if(verifyCodeSecond>0){
            console.log(verifyCodeSecond)
        }
        
        
        
        var init_text        = $js_get_mobile_code_nocaptcha.text();
        $js_get_mobile_code_nocaptcha.data('second-left', init_secode_left);
        var wait_msg = $js_get_mobile_code_nocaptcha.data('wait-msg');
        var codeType = $js_get_mobile_code_nocaptcha.data('type');
        $.ajax({
            url: url,
            type: 'POST',
            dataType: 'json',
            data: {username: mobile, type: codeType},
            success: function (data) {
                if (data.code == 1) {
                    noty({
                        text: data.msg,
                        type: 'success',
                        layout: 'center'
                    });
        
                    $js_get_mobile_code_nocaptcha.text(wait_msg.replace('[second]', init_secode_left));
                    verifyCodeSecond = 60
                    var mtimer = setInterval(function () {
                        if (init_secode_left > 0) {
                            init_secode_left--;
                            verifyCodeSecond=verifyCodeSecond-1;
                            $js_get_mobile_code_nocaptcha.text(wait_msg.replace('[second]', init_secode_left));
                        } else {
                            clearInterval(mtimer);
                            $js_get_mobile_code_nocaptcha.text(init_text);
                            $js_get_mobile_code_nocaptcha.data('sending', false);
                        }
        
                    }, 1000);
                } else {
                    var $verify_img = $form.find(".verify_img");
                    if ($verify_img.length) {
                        $verify_img.attr("src", $verify_img.attr("src") + "&refresh=" + Math.random());
                    }
                    noty({
                        text: data.msg,
                        type: 'error',
                        layout: 'center'
                    });
                    $js_get_mobile_code_nocaptcha.data('sending', false);
                }
            },
            error: function () {
                $js_get_mobile_code_nocaptcha.data('sending', false);
            },
            complete: function () {
                $js_get_mobile_code_nocaptcha.data('loading', false);
            }
        });     
      
      
      
      
      
      
      
      
      
      
      
      
      
      
      

    } else {
      // 如果业务验证不通过，给出不通过提示。此处不通过提示为业务验证不通过！
      alert('业务验证不通过！');
    }
  }    
    
    
</script>
