map $http_origin $local_cors_origin {
    default "";
    ~^https?://localhost(?::\d+)?$ $http_origin;
    ~^https?://127\.0\.0\.1(?::\d+)?$ $http_origin;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64m;

    add_header Access-Control-Allow-Origin $local_cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, XX-Device-Type, XX-Token" always;
    add_header Vary "Origin" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # 本地环境不启用生产白名单，便于调试后台和全部二开路由。
    location / {
        try_files $uri $uri/ /index.php?s=$uri&$args;
    }

    location /api/ {
        if (!-e $request_filename) {
            rewrite ^/api/(.*)$ /api/index.php?s=$1 last;
        }
    }

    location ~* ^/(upload|uploads|plugins|themes)/.+\.(?:html?|php)$ {
        return 404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_pass php:9000;
        fastcgi_read_timeout 120s;
    }

    location ~ ^/(?:\.user\.ini|\.htaccess|\.git|\.env) {
        deny all;
    }

    location ~* \.(?:css|js|gif|jpe?g|png|bmp|ico|webp|svg|woff2?|ttf)$ {
        expires -1;
        add_header Cache-Control "no-store";
        access_log off;
        try_files $uri =404;
    }
}
